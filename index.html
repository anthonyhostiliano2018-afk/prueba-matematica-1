<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prueba de Matemática I: 20 a 50 preguntas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Caveat:wght@600;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFCFF;--grid:#E3EAF5;--surface:#FFFFFF;--ink:#1A2233;--muted:#55607A;--line:#CBD5E5;
  --blue:#2440B0;--blue-soft:#E9EEFC;--on-blue:#FFFFFF;--green:#256B33;--green-soft:#E3F2E3;
  --red:#BF3328;--red-soft:#FCE8E5;--hl-a:rgba(255,226,77,.72);--focus:#2440B0;
  --sheet:#FFFFFF;--sheet-grid:#DCE5F2;--pen-1:#2440B0;--pen-2:#2B303B;--pen-3:#C8102E;
  --serif:"STIX Two Text","Cambria Math",Cambria,"Times New Roman",serif;
  --sans:"Atkinson Hyperlegible","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#152B26;--grid:#1B3530;--surface:#1A342E;--ink:#EAF0E8;--muted:#A9BCB2;--line:#2E4D45;
    --blue:#A8BEFF;--blue-soft:#21394A;--on-blue:#0F1E33;--green:#93D88A;--green-soft:#1D4330;
    --red:#FF968A;--red-soft:#4A2724;--hl-a:rgba(242,214,96,.3);--focus:#F2D660;color-scheme:dark;
    --sheet:#17302A;--sheet-grid:#24453D;--pen-1:#A8BEFF;--pen-2:#EEF2EA;--pen-3:#FF8A80;
  }
}
:root[data-theme="dark"]{
  --paper:#152B26;--grid:#1B3530;--surface:#1A342E;--ink:#EAF0E8;--muted:#A9BCB2;--line:#2E4D45;
  --blue:#A8BEFF;--blue-soft:#21394A;--on-blue:#0F1E33;--green:#93D88A;--green-soft:#1D4330;
  --red:#FF968A;--red-soft:#4A2724;--hl-a:rgba(242,214,96,.3);--focus:#F2D660;color-scheme:dark;
    --sheet:#17302A;--sheet-grid:#24453D;--pen-1:#A8BEFF;--pen-2:#EEF2EA;--pen-3:#FF8A80;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.wrap{max-width:44rem;margin:0 auto;padding:0 1.1rem}

/* cabecera y pestañas */
.mast{padding-top:1.4rem}
.mast h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.75rem,6.2vw,2.35rem);line-height:1.1;margin:0;letter-spacing:-.01em}
.mast .sub{margin:.45rem 0 0;color:var(--muted);max-width:34rem}
.tabs{display:flex;gap:.25rem;margin-top:1.1rem;border-bottom:1.5px solid var(--line);overflow-x:auto}
.tab{appearance:none;background:none;border:0;padding:.7rem .85rem .75rem;font-weight:700;color:var(--muted);position:relative;cursor:pointer;white-space:nowrap}
.tab:first-child{padding-left:0}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:.85rem;right:.85rem;bottom:-1.5px;height:3px;border-radius:3px;background:var(--blue)}
.tab:first-child[aria-selected="true"]::after{left:0}
.intro p{margin:1.1rem 0 0;max-width:36rem}

/* inicio de práctica */
.grupo{margin-top:1.6rem}
.g-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
.g-head h2,.avance h2,.resul h2,.f-u{font-family:var(--serif);font-weight:600;font-size:1.3rem;line-height:1.25;margin:0}
.g-sub{margin:.15rem 0 .75rem;color:var(--muted);font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{appearance:none;display:inline-flex;align-items:center;gap:.55rem;padding:.55rem .85rem .55rem .65rem;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;min-height:2.75rem;text-align:left}
.chip .box{flex:none;width:1.15rem;height:1.15rem;border-radius:4px;border:1.5px solid var(--muted);display:grid;place-items:center}
.chip .box svg{width:.85rem;height:.85rem;opacity:0}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.chip[aria-pressed="true"] .box{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.chip[aria-pressed="true"] .box svg{opacity:1}
.chip .n{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.chip:disabled{opacity:.45;cursor:not-allowed}
.ajustes{margin-top:1.6rem;border-top:1px solid var(--line)}
.fila,.sw{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.85rem 0;border-bottom:1px solid var(--line)}
.sw{cursor:pointer}
.fila b,.sw b{display:block}
.fila small,.sw small{display:block;color:var(--muted);font-size:.88rem;margin-top:.1rem}
.sw input{appearance:none;-webkit-appearance:none;margin:0;flex:none;width:2.9rem;height:1.7rem;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .15s}
.sw input::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.3rem;height:1.3rem;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked{background:var(--blue)}
.sw input:checked::after{transform:translateX(1.2rem)}
.seg{display:inline-flex;flex:none;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--surface);padding:.45rem .7rem;font-weight:700;cursor:pointer;min-width:2.9rem;min-height:2.5rem}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-checked="true"]{background:var(--blue);color:var(--on-blue)}
.avance{margin-top:1.6rem}
.avance p{margin:.35rem 0 .8rem}
.avance-acc{display:flex;flex-wrap:wrap;gap:.75rem 1.25rem;align-items:center}

/* botones */
.btn{appearance:none;border:1.5px solid transparent;border-radius:12px;padding:.8rem 1.1rem;font-weight:700;cursor:pointer;min-height:3rem;line-height:1.2}
.btn-pri{background:var(--blue);color:var(--on-blue)}
.btn-sec{background:var(--surface);color:var(--blue);border-color:var(--blue)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{min-height:2.4rem;padding:.45rem .8rem;font-size:.92rem}
.link{appearance:none;background:none;border:0;padding:.35rem 0;color:var(--blue);font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px;cursor:pointer}
.abar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1.5px solid var(--line);padding:.7rem 0 calc(.7rem + env(safe-area-inset-bottom,0px))}
.abar .wrap{display:flex;gap:.6rem}
.abar .btn{flex:1}
.abar .btn-sec{flex:0 1 auto}
body.con-abar{padding-bottom:5.5rem}

/* barra de la ronda */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--paper);border-bottom:1.5px solid var(--line)}
.qbar-in{display:flex;align-items:center;gap:.9rem;min-height:3.2rem}
.qpos{font-weight:700;flex:1}
.qscore{display:flex;gap:.75rem;font-weight:700;font-variant-numeric:tabular-nums}
.qscore span{display:inline-flex;align-items:center;gap:.2rem}
.qscore svg{width:1rem;height:1rem}
.c-ok{color:var(--green)}.c-bad{color:var(--red)}
.prog{height:3px}
.prog i{display:block;height:100%;background:var(--blue);transition:width .3s ease}
body.modo-quiz #mast,body.modo-quiz .pie{display:none}

/* pregunta */
.preg{padding-top:1.2rem}
.qmeta{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:0;color:var(--muted);font-size:.92rem}
.tag{display:inline-block;padding:.08rem .5rem;border-radius:6px;border:1.5px solid var(--blue);color:var(--blue);font-weight:700;font-size:.8rem}
.enun{font-family:var(--serif);font-size:1.13rem;line-height:1.62;margin:.55rem 0 1.2rem}
.enun .num{font-weight:600}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
.opt{width:100%;display:flex;align-items:center;gap:.75rem;text-align:left;padding:.75rem .85rem;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;cursor:pointer;min-height:3.3rem;transition:border-color .12s,background-color .12s}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt .let{flex:none;font-weight:700;color:var(--muted);width:1.5rem}
.opt .txt{flex:1;min-width:0;font-family:var(--serif);font-size:1.06rem;line-height:1.45}
.opt .mark{flex:none;width:1.7rem;height:1.7rem}
.opt .mark svg{width:100%;height:100%;display:block}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.ok .let,.opt.ok .mark{color:var(--green)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt.bad .let,.opt.bad .mark{color:var(--red)}
.opt.dim{opacity:.55}
.fb{margin:1.3rem 0 .6rem;font-weight:700;font-size:1.05rem}
.fb.ok{color:var(--green)}.fb.bad{color:var(--red)}
.sol{border-left:3px solid var(--blue);padding:.1rem 0 .1rem 1rem;font-family:var(--serif);font-size:1.04rem;line-height:1.62}
.sol h3{margin:0 0 .3rem;font-family:var(--sans);font-size:.95rem;color:var(--blue)}
.sol ol,.sol ul{margin:.3rem 0;padding-left:1.25rem}
.sol li{margin:.35rem 0}
.sol p{margin:.6rem 0 0}
.hl{background-image:linear-gradient(transparent 55%,var(--hl-a) 55%,var(--hl-a) 92%,transparent 92%);padding:0 .12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl.blk{display:inline-block;background:var(--hl-a);border-radius:6px;padding:.1em .3em}

/* notación matemática */
.mx{display:inline-flex;position:relative;vertical-align:middle;padding:.12em .5em;margin:.12em .08em}
.mx::before,.mx::after{content:"";position:absolute;top:0;bottom:0;width:.32em;border:1.5px solid currentColor}
.mx::before{left:0;border-right:0}
.mx::after{right:0;border-left:0}
.mx.det::before,.mx.det::after{width:0;border-top:0;border-bottom:0}
.mx-g{display:inline-grid;column-gap:.8em;text-align:center;font-variant-numeric:tabular-nums lining-nums;line-height:1.3;white-space:nowrap}
.mx-g>span{padding:.04em 0}
.mx-g>.aug{border-left:1.5px solid currentColor;padding-left:.55em;margin-left:-.25em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;line-height:1.12;margin:0 .1em}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .15em .06em}
.fr>span:last-child{padding:.06em .15em 0}
.sys{display:inline-flex;flex-direction:column;vertical-align:middle;border-left:1.5px solid currentColor;border-radius:8px 0 0 8px;padding:.1em 0 .1em .6em;margin:.2em 0;line-height:1.45;white-space:nowrap}
.tw{overflow-x:auto;margin:.6rem 0;-webkit-overflow-scrolling:touch}
table.io{border-collapse:collapse;font-family:var(--sans);font-size:.9rem;font-variant-numeric:tabular-nums;background:var(--surface)}
table.io th,table.io td{border:1px solid var(--line);padding:.38rem .6rem;text-align:right;white-space:nowrap}
table.io thead th{text-align:center;color:var(--muted);font-size:.82rem;font-weight:700}
table.io tbody th{text-align:left;font-weight:700;white-space:normal;min-width:5.5em;line-height:1.25}
@media (max-width:26rem){table.io{font-size:.84rem}table.io th,table.io td{padding:.34rem .42rem}}

/* nota final */
.resul{padding-top:1rem}
.nota{position:relative;width:13rem;height:9rem;margin:.5rem auto .25rem;display:flex;align-items:center;justify-content:center;gap:.1rem;color:var(--blue)}
.nota.desap{color:var(--red)}
.nota svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.nota path{fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:trazo .9s .2s ease-out forwards}
@keyframes trazo{to{stroke-dashoffset:0}}
.nota .v{font-family:var(--hand);font-weight:700;font-size:5.2rem;line-height:1}
.nota .d{font-family:var(--hand);font-weight:600;font-size:1.9rem;align-self:flex-end;margin-bottom:1.7rem}
.res-msg{text-align:center;margin:.25rem auto 1.6rem;max-width:30rem}
.bars{display:grid;gap:.85rem;margin:.75rem 0 1.4rem}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:.3rem .75rem;align-items:baseline}
.bar-row .ft{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.bar{grid-column:1/-1;height:.45rem;border-radius:4px;background:var(--red-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.repasa{margin:0 0 .7rem}

/* desarrollo */
.timer{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1rem;padding:.8rem 1rem;margin:1.1rem 0 1rem;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface)}
.timer .t{font-family:var(--serif);font-weight:600;font-size:1.7rem;font-variant-numeric:tabular-nums;min-width:4.6ch}
.timer .t-l{color:var(--muted);font-size:.9rem;flex:1;min-width:9rem}
.timer.low .t{color:var(--red)}
.t-b{display:flex;align-items:center;gap:.9rem}
.plist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.pitem{appearance:none;width:100%;display:grid;grid-template-columns:2rem 1fr auto;column-gap:.75rem;align-items:center;text-align:left;padding:.85rem 0;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer}
.pitem .pn{grid-row:1/3;font-family:var(--serif);font-weight:600;font-size:1.5rem;color:var(--blue);text-align:center}
.pitem .pt{font-weight:700}
.pitem .ps{grid-column:2;color:var(--muted);font-size:.9rem}
.pitem .pill{grid-column:3;grid-row:1/3}
.pill{font-size:.8rem;font-weight:700;padding:.2rem .55rem;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--green);border-color:var(--green)}
.pill.rep{color:var(--red);border-color:var(--red)}
.volver-fila{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:.9rem}
.mini-t{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.prob{padding-top:.4rem}
.p-tit{font-family:var(--serif);font-weight:600;font-size:1.35rem;margin:.35rem 0 0;line-height:1.25}
.hint{color:var(--muted);margin:0 0 1rem}
.steps{list-style:none;padding:0;margin:1rem 0;counter-reset:paso}
.steps li{counter-increment:paso;position:relative;padding:.1rem 0 1rem 2.5rem;font-family:var(--serif);font-size:1.04rem;line-height:1.62}
.steps li::before{content:counter(paso);position:absolute;left:0;top:.1rem;width:1.75rem;height:1.75rem;border-radius:50%;border:1.5px solid var(--blue);color:var(--blue);font-family:var(--sans);font-weight:700;font-size:.85rem;display:grid;place-items:center}
.steps li::after{content:"";position:absolute;left:.85rem;top:2.05rem;bottom:.2rem;border-left:1.5px dotted var(--line)}
.steps li:last-child::after{display:none}
.steps h4{margin:0 0 .15rem;font-family:var(--sans);font-size:.98rem}
.steps li.new{animation:aparece .28s ease-out}
@keyframes aparece{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.final{border:1.5px solid var(--green);background:var(--green-soft);border-radius:12px;padding:.85rem 1rem;font-family:var(--serif);font-size:1.06rem;line-height:1.55}
.auto{margin:1.25rem 0 .5rem}
.auto p{margin:0 0 .5rem;font-weight:700}
.auto-b{display:flex;flex-wrap:wrap;gap:.6rem}
.auto-b .btn{flex:1;min-width:9rem}

/* fórmulas */
.f-u{margin:1.6rem 0 .25rem}
details.fm{border-bottom:1px solid var(--line)}
details.fm>summary{list-style:none;cursor:pointer;padding:.85rem 0;font-weight:700;font-size:1.05rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}
details.fm>summary::-webkit-details-marker{display:none}
details.fm>summary::after{content:"+";font-size:1.4rem;line-height:1;color:var(--blue);font-weight:400}
details.fm[open]>summary::after{content:"−"}
.fm-b{padding:0 0 1rem}
.fm-b ul{margin:0;padding-left:1.15rem;font-family:var(--serif);font-size:1.03rem;line-height:1.62}
.fm-b li{margin:.3rem 0}

/* hoja de trabajo */
.hoja{margin:.25rem 0 1.25rem;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;-webkit-user-select:none;user-select:none}
.prob .hoja{margin:.5rem 0 1rem}
.hoja-bar{display:flex;align-items:center;justify-content:space-between;gap:.15rem .5rem;flex-wrap:wrap;padding:.25rem .35rem}
.hoja-tg{appearance:none;background:none;border:0;display:inline-flex;align-items:center;gap:.45rem;padding:.4rem .5rem;border-radius:10px;font-weight:700;cursor:pointer;min-height:2.75rem}
.hoja-tg svg{width:1.15rem;height:1.15rem;color:var(--blue);flex:none}
.hoja-tg-t{color:var(--blue);font-size:.88rem;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.hoja-tools{display:flex;align-items:center;gap:.1rem;flex-wrap:wrap}
.ht{appearance:none;border:0;background:none;min-width:2.75rem;height:2.75rem;padding:0 .45rem;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:.35rem;cursor:pointer;color:var(--ink)}
.ht svg{width:1.3rem;height:1.3rem;display:block;flex:none}
.ht.tinta i{display:block;width:1.15rem;height:1.15rem;border-radius:50%}
.ht[aria-pressed="true"]{background:var(--blue-soft)}
.ht.tinta[aria-pressed="true"] i{box-shadow:0 0 0 2.5px var(--blue-soft),0 0 0 4px var(--blue)}
.ht.confirm{background:var(--red-soft);color:var(--red);font-weight:700;font-size:.85rem}
.ht.confirm::after{content:"¿Borrar todo?"}
.hoja-papel{border-top:1.5px solid var(--line);border-bottom:1.5px solid var(--line);background:var(--sheet)}
.hoja canvas{display:block;width:100%;height:20rem;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;cursor:crosshair;background-color:var(--sheet);background-image:linear-gradient(var(--sheet-grid) 1px,transparent 1px),linear-gradient(90deg,var(--sheet-grid) 1px,transparent 1px);background-size:24px 24px}
.hoja-pie{display:flex;align-items:center;justify-content:space-between;gap:0 1rem;flex-wrap:wrap;padding:0 .85rem;font-size:.92rem}
.hoja-pie .link{min-height:2.75rem}
.hoja-pie .link:disabled{color:var(--muted);text-decoration:none;cursor:default}
.hoja-dedo{display:inline-flex;align-items:center;gap:.5rem;color:var(--muted);cursor:pointer;min-height:2.75rem}
.hoja-dedo input{width:1.15rem;height:1.15rem;margin:0;accent-color:var(--blue)}
.hoja.cerrada .hoja-tools,.hoja.cerrada .hoja-papel,.hoja.cerrada .hoja-pie{display:none}
body.dibujando{-webkit-user-select:none;user-select:none}

.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.sel .let{color:var(--blue)}
.btn-alerta{background:var(--red);color:var(--on-blue)}
.qreloj{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.fila{flex-wrap:wrap}
.revision{margin-top:1.8rem}
.revision h2{font-family:var(--serif);font-weight:600;font-size:1.3rem;margin:0}
.rev-filtro{margin:.7rem 0 .8rem}
.rev{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rev>li{border-bottom:1px solid var(--line)}
.rev summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:2.2rem 1fr auto;gap:.6rem;align-items:center;padding:.7rem 0;min-height:2.9rem}
.rev summary::-webkit-details-marker{display:none}
.rev .rn{font-family:var(--serif);font-weight:600;color:var(--muted)}
.rev .rt{font-weight:700}
.rev .re{font-size:.8rem;font-weight:700;padding:.15rem .55rem;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.rev li.ok .re{color:var(--green)}.rev li.bad .re{color:var(--red)}.rev li.nada .re{color:var(--muted)}

<script>
/* ---------- notación matemática ---------- */
function num(v){ if(typeof v!=='number') return String(v); return (v<0?'−':'')+String(Math.abs(v)); }
function M(rows,o){
  o=o||{}; const n=rows[0].length; let cells='';
  rows.forEach(r=>r.forEach((v,j)=>{ cells+='<span'+(o.aug===j?' class="aug"':'')+'>'+num(v)+'</span>'; }));
  const lab=(o.det?'determinante':'matriz')+' de '+rows.length+' por '+n+': '+rows.map(r=>r.map(num).join(', ')).join('; ');
  return '<span class="mx'+(o.det?' det':'')+'" role="img" aria-label="'+lab+'"><span class="mx-g" aria-hidden="true" style="grid-template-columns:repeat('+n+',auto)">'+cells+'</span></span>';
}
function F(a,b){ return '<span class="fr"><span>'+a+'</span><span>'+b+'</span></span>'; }
function SYS(l){ return '<span class="sys">'+l.map(x=>'<span>'+x+'</span>').join('')+'</span>'; }
function R(t){ return '<span class="hl'+(t.indexOf('class="mx')>=0?' blk':'')+'">'+t+'</span>'; }
function TBL(h,rows){
  return '<div class="tw"><table class="io"><thead><tr>'+h.map(x=>'<th scope="col">'+x+'</th>').join('')+'</tr></thead><tbody>'+
    rows.map(r=>'<tr>'+r.map((c,i)=>i===0?'<th scope="row">'+c+'</th>':'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}


const BANCO1=(()=>{
const TEMAS={
  inec:{u:1,n:'Inecuaciones y presupuestos'},
  matr:{u:1,n:'Matrices'},
  det:{u:1,n:'Determinantes e inversa'},
  sist:{u:1,n:'Sistemas: Cramer y Gauss'},
  leon:{u:1,n:'Modelo de Leontief'},
  recta:{u:2,n:'La recta'},
  equi:{u:2,n:'Costo, ingreso y equilibrio'},
  parab:{u:2,n:'La parábola'},
  conic:{u:2,n:'Elipse e hipérbola'}
};
const UNIDADES={
  1:{n:'Unidad I',d:'Números reales, matrices, determinantes, sistemas de ecuaciones y Leontief.'},
  2:{n:'Unidad II',d:'Geometría analítica: recta, parábola, elipse e hipérbola.'}
};

const T_AS=TBL(['','Agro','Servicios','D. final','Total'],[['Agro',100,50,50,200],['Servicios',50,100,100,250],['Insumos primarios',50,100,'','']]);
const A_AS=M([[0.5,0.2],[0.25,0.4]]);
const INV_AS=M([[2.4,0.8],[1,2]]);

const PREGUNTAS=[
/* ===== UNIDAD I · Inecuaciones ===== */
{id:'inec1',t:'inec',ex:true,
 q:`Una empresa fabricará 5 000 unidades en total entre las plantas A y B. En A, el costo unitario por mano de obra y material es $4 y el costo fijo $20 000; en B es $4.80 por unidad y $25 000 fijos. Si el costo total de ambas plantas no debe superar $67 000, ¿cuál es el número mínimo de unidades que debe producir la planta A?`,
 o:['2 500 unidades','2 000 unidades','3 000 unidades','Ninguno: el presupuesto alcanza con cualquier reparto'],a:0,
 s:`<ol><li>Si A produce x unidades, B produce 5 000 − x.</li>
<li>Costo total: (4x + 20 000) + [4.80(5 000 − x) + 25 000] = 4x + 20 000 + 24 000 − 4.8x + 25 000 = 69 000 − 0.8x.</li>
<li>“No más de $67 000” se escribe con ≤: 69 000 − 0.8x ≤ 67 000 → −0.8x ≤ −2 000.</li>
<li>Al dividir entre −0.8 (negativo) el sentido se invierte: x ≥ 2 500.</li></ol>
<p>La planta A debe producir ${R('al menos 2 500 unidades')}. Comprueba: con x = 2 500 el costo es 69 000 − 2 000 = 67 000 ✓.</p>`},
{id:'inec2',t:'inec',
 q:`Al resolver un problema de presupuesto como el de las dos plantas obtienes x ≥ −4 000, donde x son las unidades que produce la planta A (de un total de 6 000). ¿Cuál es el número mínimo de unidades que debe producir A?`,
 o:['0 unidades: el presupuesto se cumple con cualquier reparto','−4 000 unidades','4 000 unidades','El problema no tiene solución'],a:0,
 s:`<ol><li>x cuenta unidades, así que también se cumple 0 ≤ x ≤ 6 000 (el dominio del problema).</li>
<li>La solución x ≥ −4 000 ya incluye todos esos valores: ningún reparto se pasa del presupuesto.</li>
<li>Manda la cota más exigente de las dos: x ≥ 0.</li></ol>
<p>El mínimo es ${R('0 unidades')}. Una cantidad negativa nunca es respuesta: interseca siempre tu resultado con el dominio.</p>`},
{id:'inec3',t:'inec',
 q:`Resuelve la inecuación 3x − 7 ≤ 5x + 9.`,
 o:['x ≥ −8, es decir [−8, ∞)','x ≤ −8, es decir (−∞, −8]','x ≥ 8, es decir [8, ∞)','x ≤ 8, es decir (−∞, 8]'],a:0,
 s:`<ol><li>Agrupa x a un lado: 3x − 5x ≤ 9 + 7 → −2x ≤ 16.</li>
<li>Divide entre −2 e invierte el sentido: x ≥ −8.</li></ol>
<p>${R('CS = [−8, ∞)')}. El corchete indica que −8 sí está incluido. El error típico es no invertir “≤” al dividir entre un negativo.</p>`},
{id:'inec4',t:'inec',
 q:`Un emprendedor vende polos a S/ 25 cada uno. El costo variable es S/ 15 por polo y el costo fijo, S/ 3 000 al mes. ¿Cuántos polos debe vender como mínimo para ganar al menos S/ 2 000 al mes?`,
 o:['500 polos','300 polos','200 polos','334 polos'],a:0,
 s:`<ol><li>Utilidad: U = 25x − (15x + 3 000) = 10x − 3 000.</li>
<li>“Al menos S/ 2 000”: 10x − 3 000 ≥ 2 000 → 10x ≥ 5 000 → x ≥ 500.</li></ol>
<p>Debe vender ${R('al menos 500 polos')}. Con 300 está en equilibrio (gana S/ 0); 200 sale de olvidar el costo fijo.</p>`},
{id:'inec5',t:'inec',
 q:`Una MYPE tiene S/ 12 000 para publicidad este mes. Ya pagó un paquete fijo de S/ 2 000 y cada anuncio en radio cuesta S/ 400. ¿Cuántos anuncios puede contratar como máximo?`,
 o:['25','30','35','20'],a:0,
 s:`<ol><li>Gasto total: 2 000 + 400x, que no puede pasar de 12 000.</li>
<li>2 000 + 400x ≤ 12 000 → 400x ≤ 10 000 → x ≤ 25.</li></ol>
<p>Como máximo ${R('25 anuncios')}. El 30 aparece si se ignora el pago fijo.</p>`},
{id:'inec6',t:'inec',
 q:`¿Para qué valores de x se cumple x² − 5x + 6 &lt; 0?`,
 o:['2 &lt; x &lt; 3','x &lt; 2 o x &gt; 3','−3 &lt; x &lt; −2','x &lt; −3 o x &gt; −2'],a:0,
 s:`<ol><li>Factoriza: (x − 2)(x − 3) &lt; 0. Puntos críticos: x = 2 y x = 3.</li>
<li>Prueba un valor de cada zona: x = 0 da 6 (positivo), x = 2.5 da −0.25 (negativo) y x = 4 da 2 (positivo).</li>
<li>Piden “&lt; 0”: la zona negativa está entre las raíces.</li></ol>
<p>${R('CS = (2, 3)')}, es decir 2 &lt; x &lt; 3.</p>`},
{id:'inec7',t:'inec',
 q:`Si a &lt; b y c &lt; 0, ¿cuál de estas afirmaciones es verdadera?`,
 o:['ac &gt; bc','ac &lt; bc','a + c &gt; b + c',`${F('a','c')} &lt; ${F('b','c')}`],a:0,
 s:`<ul><li>Multiplicar o dividir ambos lados por un negativo ${R('invierte el sentido')}: de a &lt; b se pasa a ac &gt; bc (y también a/c &gt; b/c).</li>
<li>Sumar el mismo número no cambia el sentido: a + c &lt; b + c.</li></ul>
<p>Ejemplo: 2 &lt; 5 y c = −1 → −2 &gt; −5 ✓.</p>`},

/* ===== Matrices ===== */
{id:'matr1',t:'matr',
 q:`Dada A = ${M([[4,-1,0],[2,7,-3]])}, ¿cuál es su orden y cuánto vale a₂₃?`,
 o:['2 × 3 y a₂₃ = −3','3 × 2 y a₂₃ = −3','2 × 3 y a₂₃ = 0','3 × 2 y a₂₃ = 7'],a:0,
 s:`<ul><li>Orden m × n = filas × columnas: 2 filas y 3 columnas → 2 × 3.</li>
<li>a<sub>ij</sub> está en la fila i y la columna j: a₂₃ es fila 2, columna 3 → ${R('−3')}.</li></ul>
<p>Cuidado: a₁₃ = 0 y a₂₂ = 7.</p>`},
{id:'matr2',t:'matr',
 q:`Si A es de orden 2 × 3 y B es de orden 3 × 4, ¿qué puedes afirmar sobre AB y BA?`,
 o:['AB existe y es 2 × 4; BA no existe','AB es 3 × 3 y BA es 4 × 2','AB y BA existen y son iguales','AB no existe porque A y B tienen distinto orden'],a:0,
 s:`<ul><li>Regla: A(m×n) · B(n×p) = C(m×p). Las columnas de la primera deben coincidir con las filas de la segunda.</li>
<li>AB: 2×<b>3</b> · <b>3</b>×4 → coinciden → ${R('AB es 2 × 4')}.</li>
<li>BA: 3×<b>4</b> · <b>2</b>×3 → 4 ≠ 2 → BA no existe.</li></ul>`},
{id:'matr3',t:'matr',
 q:`Si A = ${M([[1,-2],[0,3]])} y B = ${M([[2,1],[-1,4]])}, calcula 2A − 3B.`,
 o:[M([[-4,-7],[3,-6]]),M([[8,-1],[-3,18]]),M([[-4,-7],[-3,-6]]),M([[-1,-3],[1,-1]])],a:0,
 s:`<ol><li>2A = ${M([[2,-4],[0,6]])} y 3B = ${M([[6,3],[-3,12]])}.</li>
<li>Resta elemento a elemento: 2 − 6 = −4; −4 − 3 = −7; 0 − (−3) = 3; 6 − 12 = −6.</li></ol>
<p>2A − 3B = ${R(M([[-4,-7],[3,-6]]))}. Ojo con 0 − (−3) = +3.</p>`},
{id:'matr4',t:'matr',
 q:`Si A = ${M([[2,1],[3,4]])} y B = ${M([[1,0],[2,5]])}, ¿cuánto es AB?`,
 o:[M([[4,5],[11,20]]),M([[2,1],[19,22]]),M([[2,0],[6,20]]),M([[4,11],[5,20]])],a:0,
 s:`<ol><li>Cada elemento es fila de A por columna de B: c₁₁ = 2·1 + 1·2 = 4; c₁₂ = 2·0 + 1·5 = 5.</li>
<li>c₂₁ = 3·1 + 4·2 = 11; c₂₂ = 3·0 + 4·5 = 20.</li></ol>
<p>AB = ${R(M([[4,5],[11,20]]))}. En cambio BA = ${M([[2,1],[19,22]])}: el producto de matrices no es conmutativo.</p>`},
{id:'matr5',t:'matr',
 q:`Una tienda tiene dos locales. La matriz Q da el stock (filas: local 1 y local 2; columnas: polos, jeans y casacas) y P da los precios en soles: Q = ${M([[10,5,8],[6,12,4]])}, P = ${M([[30],[80],[120]])}. ¿Cuál es el valor del inventario del local 2?`,
 o:['S/ 1 620','S/ 1 660','S/ 3 280','S/ 2 040'],a:0,
 s:`<ol><li>QP es (2×3)(3×1) = 2×1: cada fila da el valor de un local.</li>
<li>Local 2: 6·30 + 12·80 + 4·120 = 180 + 960 + 480 = 1 620.</li>
<li>Local 1: 10·30 + 5·80 + 8·120 = 300 + 400 + 960 = 1 660.</li></ol>
<p>Local 2: ${R('S/ 1 620')}. El valor total del inventario es S/ 3 280.</p>`},
{id:'matr6',t:'matr',ex:true,
 q:`Dadas A = ${M([[2,1,0],[1,3,1],[0,1,2]])} y B = ${M([[1,0,2],[0,1,1],[1,1,0]])}, ¿cuál es la fila 2 del producto AB?`,
 o:['(2, 4, 5)','(2, 1, 5)','(2, 3, 1)','(0, 3, 1)'],a:0,
 s:`<ol><li>La fila 2 de AB sale de la fila 2 de A, (1, 3, 1), multiplicada por cada columna de B.</li>
<li>Columna 1 (1, 0, 1): 1·1 + 3·0 + 1·1 = 2.</li>
<li>Columna 2 (0, 1, 1): 1·0 + 3·1 + 1·1 = 4.</li>
<li>Columna 3 (2, 1, 0): 1·2 + 3·1 + 1·0 = 5.</li></ol>
<p>Fila 2: ${R('(2, 4, 5)')}. Completa: AB = ${M([[2,1,5],[2,4,5],[2,3,1]])}. La opción (0, 3, 1) es el error de multiplicar elemento por elemento.</p>`},

/* ===== Determinantes ===== */
{id:'det1',t:'det',
 q:`Calcula el determinante de ${M([[2,0,1],[1,3,-1],[4,1,2]])}.`,
 o:['3','23','−3','13'],a:0,
 s:`<ol><li>Sarrus, diagonales que bajan (+): 2·3·2 + 0·(−1)·4 + 1·1·1 = 12 + 0 + 1 = 13.</li>
<li>Diagonales que suben (−): 1·3·4 + 2·(−1)·1 + 0·1·2 = 12 − 2 + 0 = 10.</li>
<li>|A| = 13 − 10 = 3.</li></ol>
<p>${R('|A| = 3')}. Comprueba con cofactores por la fila 1: 2(6 + 1) − 0 + 1(1 − 12) = 14 − 11 = 3 ✓.</p>`},
{id:'det2',t:'det',
 q:`A es una matriz 3 × 3 con det(A) = 4. ¿Cuánto vale det(2A)?`,
 o:['32','8','16','64'],a:0,
 s:`<ul><li>Multiplicar toda la matriz por k multiplica cada una de sus n filas por k.</li>
<li>Por eso |kA| = kⁿ|A|. Aquí: 2³ · 4 = 8 · 4 = 32.</li></ul>
<p>${R('det(2A) = 32')}. Responder 8 es el error frecuente: eso pasaría si solo multiplicaras una fila por 2.</p>`},
{id:'det3',t:'det',ex:true,
 q:`A y B son matrices 3 × 3 con det(A) = 8 y det(B) = −3. ¿Cuánto valen det(AB) y det(BA)?`,
 o:['Ambos valen −24','det(AB) = −24 y det(BA) = 24','Ambos valen 5','No se puede saber sin calcular AB'],a:0,
 s:`<ul><li>Propiedad: |AB| = |A| · |B| = 8 · (−3) = −24.</li>
<li>|BA| = |B| · |A| = −24 también: aunque AB ≠ BA, sus determinantes son iguales.</li></ul>
<p>${R('det(AB) = det(BA) = −24')}. En el examen esta propiedad te sirve para comprobar tu producto AB.</p>`},
{id:'det4',t:'det',
 q:`¿Para qué valores de k la matriz ${M([['k',4],[2,'k − 2']])} no tiene inversa?`,
 o:['k = 4 o k = −2','k = −4 o k = 2','Solo k = 2','Para ningún k: siempre tiene inversa'],a:0,
 s:`<ol><li>Una matriz no tiene inversa cuando su determinante es 0.</li>
<li>det = k(k − 2) − 4·2 = k² − 2k − 8.</li>
<li>k² − 2k − 8 = 0 → (k − 4)(k + 2) = 0 → k = 4 o k = −2.</li></ol>
<p>${R('k = 4 o k = −2')}: con esos valores la matriz es singular.</p>`},
{id:'det5',t:'det',
 q:`¿Cuál es la inversa de ${M([[2,1],[4,3]])}?`,
 o:[M([[1.5,-0.5],[-2,1]]),M([[3,-1],[-4,2]]),M([[1,-0.5],[-2,1.5]]),M([[1.5,0.5],[2,1]])],a:0,
 s:`<ol><li>det = 2·3 − 1·4 = 2 (≠ 0, sí tiene inversa).</li>
<li>Intercambia la diagonal principal (2 ↔ 3) y cambia el signo de la secundaria: ${M([[3,-1],[-4,2]])}.</li>
<li>Multiplica por 1/det = 1/2.</li></ol>
<p>A⁻¹ = ${R(M([[1.5,-0.5],[-2,1]]))}. Verifica: A · A⁻¹ = ${M([[1,0],[0,1]])} ✓.</p>`},
{id:'det6',t:'det',
 q:`¿Cuál de estas afirmaciones sobre determinantes es <b>falsa</b>?`,
 o:['Si intercambias dos filas, el determinante no cambia','Si una fila es múltiplo de otra, el determinante es 0','det(Aᵀ) = det(A)','Si a una fila le sumas k veces otra, el determinante no cambia'],a:0,
 s:`<ul><li>Intercambiar dos filas ${R('cambia el signo')} del determinante: esa es la falsa.</li>
<li>Filas proporcionales dan 0; transponer no cambia el valor; R<sub>i</sub> → R<sub>i</sub> + kR<sub>j</sub> tampoco (por eso sirve para triangular).</li></ul>
<p>Otras: multiplicar una fila por k multiplica |A| por k; si A es triangular, |A| es el producto de su diagonal; |A⁻¹| = 1/|A|.</p>`},

/* ===== Sistemas ===== */
{id:'sist1',t:'sist',
 q:`Un cliente paga S/ 12 por 2 sándwiches y 3 jugos, y un sándwich cuesta S/ 1 más que un jugo. Con 2x + 3y = 12 y x − y = 1, resuelve por Cramer. ¿Cuánto cuesta cada producto?`,
 o:['Sándwich S/ 3 y jugo S/ 2','Sándwich S/ 2 y jugo S/ 3','Sándwich S/ 1.50 y jugo S/ 3','Sándwich S/ 2 y jugo S/ 1'],a:0,
 s:`<ol><li>Δ = ${M([[2,3],[1,-1]],{det:1})} = 2(−1) − 3·1 = −5.</li>
<li>Δx = ${M([[12,3],[1,-1]],{det:1})} = −12 − 3 = −15 → x = −15/−5 = 3.</li>
<li>Δy = ${M([[2,12],[1,1]],{det:1})} = 2 − 12 = −10 → y = −10/−5 = 2.</li></ol>
<p>${R('Sándwich S/ 3 y jugo S/ 2')}. Verifica: 2·3 + 3·2 = 12 ✓ y 3 − 2 = 1 ✓.</p>`},
{id:'sist2',t:'sist',
 q:`Resuelve por Cramer: ${SYS(['2x + y − z = 3','x − y + 2z = 7','3x + 2y + z = 16'])}`,
 o:['x = 2, y = 3, z = 4','x = 1, y = 2, z = 3','x = 3, y = 2, z = 4','x = 2, y = 4, z = 3'],a:0,
 s:`<ol><li>Δ = ${M([[2,1,-1],[1,-1,2],[3,2,1]],{det:1})} = (−2 + 6 − 2) − (3 + 8 + 1) = 2 − 12 = −10 ≠ 0.</li>
<li>Reemplaza la columna de cada incógnita por (3, 7, 16): Δx = −20, Δy = −30, Δz = −40.</li>
<li>x = −20/−10 = 2; y = −30/−10 = 3; z = −40/−10 = 4.</li></ol>
<p>${R('CS = {(2; 3; 4)}')}. Verifica en la tercera ecuación: 6 + 6 + 4 = 16 ✓.</p>`},
{id:'sist3',t:'sist',
 q:`¿Cuál es la matriz aumentada de este sistema? ${SYS(['x + 2y = 5','3x − z = 1','y + 4z = −2'])}`,
 o:[M([[1,2,0,5],[3,0,-1,1],[0,1,4,-2]],{aug:3}),M([[1,2,5],[3,-1,1],[1,4,-2]],{aug:2}),M([[1,2,0,5],[3,-1,0,1],[0,1,4,-2]],{aug:3}),M([[1,3,0,5],[2,0,1,1],[0,-1,4,-2]],{aug:3})],a:0,
 s:`<ul><li>Cada columna es una incógnita, en orden x, y, z; si una incógnita no aparece, su coeficiente es 0.</li>
<li>“3x − z = 1” no tiene y → fila (3, 0, −1 | 1). “y + 4z = −2” no tiene x → fila (0, 1, 4 | −2).</li>
<li>Después de la barra van los términos independientes.</li></ul>
<p>[A | B] = ${R(M([[1,2,0,5],[3,0,-1,1],[0,1,4,-2]],{aug:3}))}</p>`},
{id:'sist4',t:'sist',
 q:`¿Cuál de estas <b>no</b> es una operación elemental de fila válida en Gauss-Jordan?`,
 o:['R₂ → 0·R₂','R₁ ↔ R₃',`R₂ → −${F(1,2)}R₂`,'R₃ → R₃ − 4R₁'],a:0,
 s:`<ul><li>Las tres operaciones válidas: intercambiar filas (R<sub>i</sub> ↔ R<sub>j</sub>), multiplicar una fila por k ${R('≠ 0')} y sumar a una fila un múltiplo de otra (R<sub>i</sub> → R<sub>i</sub> + kR<sub>j</sub>).</li>
<li>Multiplicar por 0 borra una ecuación: el sistema deja de ser equivalente.</li></ul>
<p>Tampoco vale “sumar un mismo número a toda una fila”.</p>`},
{id:'sist5',t:'sist',
 q:`Al aplicar Gauss a un sistema de 3 ecuaciones llegas a ${M([[1,2,-1,4],[0,1,3,2],[0,0,0,5]],{aug:3})}. ¿Qué tipo de sistema es?`,
 o:['Incompatible: no tiene solución','Compatible indeterminado: infinitas soluciones','Compatible determinado, con z = 5','Compatible determinado, con z = 0'],a:0,
 s:`<ul><li>La fila 3 dice 0x + 0y + 0z = 5, es decir 0 = 5: contradicción.</li>
<li>Por eso el sistema es ${R('incompatible')}.</li>
<li>Si la última fila fuera 0 = 0, habría una variable libre: infinitas soluciones.</li></ul>
<p>Con rangos: r(A) = 2 ≠ r(A|B) = 3.</p>`},
{id:'sist6',t:'sist',ex:true,
 q:`Una chocolatería de Ica arma tres tipos de cajas. La caja I lleva 1 chocoteja de pecana, 2 de maní y 1 de fruta; la II, 1 de pecana, 1 de maní y 2 de fruta; la III, 1 de pecana, 3 de maní y 2 de fruta. Hay exactamente 10 de pecana, 22 de maní y 18 de fruta. Usando Gauss, ¿cuántas cajas de cada tipo se arman usando todo?`,
 o:['2 cajas I, 3 cajas II y 5 cajas III','3 cajas I, 2 cajas II y 5 cajas III','5 cajas I, 3 cajas II y 2 cajas III','2 cajas I, 5 cajas II y 3 cajas III'],a:0,
 s:`<ol><li>Con x, y, z = cajas I, II y III: ${SYS(['x + y + z = 10','2x + y + 3z = 22','x + 2y + 2z = 18'])}</li>
<li>Matriz aumentada: ${M([[1,1,1,10],[2,1,3,22],[1,2,2,18]],{aug:3})}</li>
<li>R₂ → R₂ − 2R₁ y R₃ → R₃ − R₁: ${M([[1,1,1,10],[0,-1,1,2],[0,1,1,8]],{aug:3})}</li>
<li>R₃ → R₃ + R₂: ${M([[1,1,1,10],[0,-1,1,2],[0,0,2,10]],{aug:3})}</li>
<li>Sustitución regresiva: 2z = 10 → z = 5; −y + 5 = 2 → y = 3; x = 10 − 3 − 5 = 2.</li></ol>
<p>${R('2 cajas I, 3 cajas II y 5 cajas III')}. Verifica el maní: 2·2 + 3 + 3·5 = 22 ✓.</p>`},
{id:'sist7',t:'sist',ex:true,
 q:`Con la solución de las chocotejas (2 cajas I, 3 cajas II y 5 cajas III), si cada caja se vende a S/ 12, S/ 15 y S/ 20 respectivamente, ¿cuál es el ingreso total?`,
 o:['S/ 169','S/ 159','S/ 145','S/ 47'],a:0,
 s:`<ul><li>Es un producto fila por columna: (12, 15, 20) · (2, 3, 5) = 12·2 + 15·3 + 20·5.</li>
<li>= 24 + 45 + 100 = 169.</li></ul>
<p>Ingreso total: ${R('S/ 169')}. Escribe siempre la unidad que pide el enunciado (soles, centavos, dólares).</p>`},
{id:'sist8',t:'sist',
 q:`¿Tiene solución única el sistema 2x + 4y = 10, 3x + 6y = 12?`,
 o:['No: Δ = 0 y las ecuaciones se contradicen, así que no tiene solución','No: Δ = 0 y tiene infinitas soluciones','Sí: x = 5, y = 0','Sí, porque Δ = 24'],a:0,
 s:`<ol><li>Δ = ${M([[2,4],[3,6]],{det:1})} = 12 − 12 = 0 → no hay solución única (Cramer no se puede aplicar).</li>
<li>Para saber si son infinitas o ninguna: divide la primera entre 2 → x + 2y = 5; la segunda entre 3 → x + 2y = 4.</li>
<li>x + 2y no puede valer 5 y 4 a la vez: son rectas paralelas.</li></ol>
<p>El sistema es ${R('incompatible')}. (x = 5, y = 0 solo cumple la primera ecuación.)</p>`},

/* ===== Leontief ===== */
{id:'leon1',t:'leon',
 q:`Con esta tabla insumo-producto (en millones de soles), ¿cuál es la matriz de coeficientes técnicos A? ${T_AS}`,
 o:[A_AS,M([[0.5,0.25],[0.2,0.4]]),M([[0.4,0.2],[0.2,0.4]]),M([[2,5],[4,2.5]])],a:0,
 s:`<ul><li>a<sub>ij</sub> = z<sub>ij</sub> / X<sub>j</sub>: cada <b>columna</b> se divide entre la producción total del sector que la encabeza.</li>
<li>Columna Agro ÷ 200: 100/200 = 0.5 y 50/200 = 0.25.</li>
<li>Columna Servicios ÷ 250: 50/250 = 0.2 y 100/250 = 0.4.</li></ul>
<p>A = ${R(A_AS)}. Las columnas suman 0.75 y 0.6 (menos de 1 ✓). Dividir por filas da la transpuesta: es el error clásico.</p>`},
{id:'leon2',t:'leon',
 q:`En A = ${A_AS} (sector 1 = Agro, sector 2 = Servicios), ¿qué significa a₁₂ = 0.2?`,
 o:['Por cada sol que produce Servicios, compra S/ 0.20 a Agro','Por cada sol que produce Agro, compra S/ 0.20 a Servicios','Agro destina el 20 % de su producción a la demanda final','Servicios usa el 20 % de su propia producción'],a:0,
 s:`<ul><li>La fila indica quién vende y la columna quién compra.</li>
<li>a₁₂: fila 1 (Agro vende), columna 2 (Servicios compra).</li></ul>
<p>${R('Por cada sol que produce Servicios, le compra S/ 0.20 a Agro')}. En cambio a₂₁ = 0.25: por cada sol que produce Agro, le compra S/ 0.25 a Servicios.</p>`},
{id:'leon3',t:'leon',
 q:`Para A = ${A_AS}, ¿cuál es la inversa de Leontief (I − A)⁻¹?`,
 o:[INV_AS,M([[2,0.8],[1,2.4]]),M([[2.4,-0.8],[-1,2]]),M([[0.6,0.2],[0.25,0.5]])],a:0,
 s:`<ol><li>I − A = ${M([[0.5,-0.2],[-0.25,0.6]])}.</li>
<li>det(I − A) = 0.5·0.6 − (−0.2)(−0.25) = 0.30 − 0.05 = 0.25.</li>
<li>Intercambia la diagonal y cambia el signo de la secundaria: ${M([[0.6,0.2],[0.25,0.5]])}; luego multiplica por 1/0.25 = 4.</li></ol>
<p>(I − A)⁻¹ = ${R(INV_AS)}.</p>`},
{id:'leon4',t:'leon',
 q:`Con (I − A)⁻¹ = ${INV_AS}, si la demanda final proyectada es D = (60, 120) para Agro y Servicios, ¿cuánto debe producir cada sector?`,
 o:['Agro 240 y Servicios 300','Agro 300 y Servicios 240','Agro 216 y Servicios 348','Agro 114 y Servicios 183'],a:0,
 s:`<ol><li>X = (I − A)⁻¹ D.</li>
<li>X₁ = 2.4·60 + 0.8·120 = 144 + 96 = 240.</li>
<li>X₂ = 1·60 + 2·120 = 60 + 240 = 300.</li></ol>
<p>${R('X = (240, 300)')}. Verifica con X = AX + D: 0.5·240 + 0.2·300 + 60 = 240 ✓ y 0.25·240 + 0.4·300 + 120 = 300 ✓.</p>`},
{id:'leon5',t:'leon',
 q:`Si (I − A)⁻¹ = ${INV_AS} (columna 1 = Agro, columna 2 = Servicios), ¿qué sector tiene el mayor multiplicador de producción?`,
 o:['Agro, con 3.4','Servicios, con 2.8','Agro, con 3.2','Servicios, con 3.0'],a:0,
 s:`<ul><li>El multiplicador es la suma de cada <b>columna</b> de la inversa.</li>
<li>Agro: 2.4 + 1 = 3.4. Servicios: 0.8 + 2 = 2.8.</li></ul>
<p>${R('Agro, con 3.4')}: cada S/ 1 adicional de demanda final de Agro genera S/ 3.40 de producción en toda la economía. 3.2 y 3.0 son sumas de filas.</p>`},
{id:'leon6',t:'leon',
 q:`Para atender D = (60, 120), la nueva producción es X = (240, 300). En la tabla original, los insumos primarios eran 50 en Agro (de un total de 200) y 100 en Servicios (de 250). ¿Cuánto suman los nuevos insumos primarios?`,
 o:['180, igual al total de la demanda final','171','540, igual a la producción total','150, no cambian'],a:0,
 s:`<ol><li>Coeficientes primarios: Agro 50/200 = 0.25; Servicios 100/250 = 0.4 (también es 1 − la suma de cada columna de A).</li>
<li>Nuevos insumos primarios: 0.25·240 = 60 y 0.4·300 = 120.</li>
<li>Total: 60 + 120 = 180.</li></ol>
<p>${R('180')}, que coincide con la demanda final 60 + 120 = 180: es el control de errores del modelo.</p>`},
{id:'leon7',t:'leon',
 q:`Tabla de dos sectores: el sector 1 vende 20 a sí mismo, 56 al sector 2 y 24 a la demanda final (total 100); el sector 2 vende 50 al sector 1, 8 a sí mismo y 22 a la demanda final (total 80). Si la nueva demanda final es D = (74, 37), ¿cuánto debe producir cada sector?`,
 o:['X₁ = 250 y X₂ = 180','X₁ = 180 y X₂ = 250','X₁ = 236 y X₂ = 205','X₁ = 114.7 y X₂ = 77.7'],a:0,
 s:`<ol><li>A (cada columna ÷ total del sector que compra): 20/100, 56/80, 50/100 y 8/80 → ${M([[0.2,0.7],[0.5,0.1]])}.</li>
<li>I − A = ${M([[0.8,-0.7],[-0.5,0.9]])}; det = 0.72 − 0.35 = 0.37.</li>
<li>X = (1/0.37) ${M([[0.9,0.7],[0.5,0.8]])} ${M([[74],[37]])}</li>
<li>X₁ = (66.6 + 25.9)/0.37 = 92.5/0.37 = 250; X₂ = (37 + 29.6)/0.37 = 66.6/0.37 = 180.</li></ol>
<p>${R('X = (250, 180)')}. La opción (236, 205) sale de dividir por filas.</p>`},
{id:'leon8',t:'leon',
 q:`En una matriz A de coeficientes técnicos, una columna suma 1.05. ¿Qué significa?`,
 o:['El sector gasta en insumos intermedios más de lo que produce: no genera valor agregado y el modelo es inviable','Ese sector tiene el mayor multiplicador','Nada raro: las columnas de A siempre suman 1','Hay que restar 1 a la diagonal para corregirla'],a:0,
 s:`<ul><li>Cada a<sub>ij</sub> está entre 0 y 1, y cada columna debe sumar ${R('menos de 1')}.</li>
<li>Lo que falta para llegar a 1 es el coeficiente primario: valor agregado (remuneraciones, excedente, impuestos).</li>
<li>Si una columna suma 1 o más, ese sector no genera valor agregado.</li></ul>`},

/* ===== UNIDAD II · La recta ===== */
{id:'recta1',t:'recta',
 q:`Halla la ecuación general de la recta que pasa por (−1, 3) y (2, −3).`,
 o:['2x + y − 1 = 0','2x − y + 1 = 0','x + 2y − 5 = 0','2x + y − 5 = 0'],a:0,
 s:`<ol><li>m = (−3 − 3)/(2 − (−1)) = −6/3 = −2.</li>
<li>Punto-pendiente con (−1, 3): y − 3 = −2(x + 1) → y = −2x + 1.</li>
<li>Pasa todo a un lado: 2x + y − 1 = 0.</li></ol>
<p>${R('2x + y − 1 = 0')}. Verifica con (2, −3): 4 − 3 − 1 = 0 ✓.</p>`},
{id:'recta2',t:'recta',
 q:`¿Cuál es la pendiente de la recta 3x − 4y + 8 = 0?`,
 o:[F(3,4),'3','−'+F(3,4),'−'+F(4,3)],a:0,
 s:`<ol><li>Despeja y: −4y = −3x − 8 → y = ${F(3,4)}x + 2.</li>
<li>El coeficiente de x es la pendiente.</li></ol>
<p>${R('m = 3/4')}. Atajo: m = −A/B = −3/(−4) = 3/4. Error frecuente: leer m = 3 sin despejar y.</p>`},
{id:'recta3',t:'recta',
 q:`Halla la recta que pasa por (1, 4) y es perpendicular a 2x + y − 5 = 0.`,
 o:['x − 2y + 7 = 0','2x + y − 6 = 0','x + 2y − 9 = 0','x − 2y − 7 = 0'],a:0,
 s:`<ol><li>Recta dada: y = −2x + 5 → m₁ = −2.</li>
<li>Perpendicular: m₁ · m₂ = −1 → m₂ = ${F(1,2)}.</li>
<li>y − 4 = ½(x − 1) → 2y − 8 = x − 1 → x − 2y + 7 = 0.</li></ol>
<p>${R('x − 2y + 7 = 0')} (o y = ½x + 7/2). 2x + y − 6 = 0 sería la paralela por ese punto.</p>`},
{id:'recta4',t:'recta',
 q:`¿Cuáles son los interceptos de 2x + 5y − 10 = 0 con los ejes?`,
 o:['(5, 0) y (0, 2)','(2, 0) y (0, 5)','(−5, 0) y (0, −2)','(10, 0) y (0, 10)'],a:0,
 s:`<ul><li>Con el eje x, y = 0: 2x = 10 → x = 5 → (5, 0).</li>
<li>Con el eje y, x = 0: 5y = 10 → y = 2 → (0, 2).</li></ul>
<p>${R('(5, 0) y (0, 2)')}: con esos dos puntos ya puedes graficarla.</p>`},
{id:'recta5',t:'recta',
 q:`Las rectas y = 3x − 1 y x + 3y = 6 son:`,
 o:['Perpendiculares','Paralelas','Coincidentes','Ni paralelas ni perpendiculares'],a:0,
 s:`<ul><li>Primera: m₁ = 3. Segunda: y = −⅓x + 2 → m₂ = −⅓.</li>
<li>m₁ · m₂ = 3 · (−⅓) = −1.</li></ul>
<p>Son ${R('perpendiculares')}. Para ser paralelas necesitarían m₁ = m₂.</p>`},
{id:'recta6',t:'recta',
 q:`¿Cuál es la ecuación de la recta que pasa por (3, 4) y es perpendicular a la recta x = 2?`,
 o:['y = 4','x = 3','y = 3','x = 4'],a:0,
 s:`<ul><li>x = 2 es una recta vertical (pendiente no definida).</li>
<li>Su perpendicular es horizontal (m = 0): y = constante.</li>
<li>Como pasa por (3, 4), esa constante es 4.</li></ul>
<p>${R('y = 4')}.</p>`},
{id:'recta7',t:'recta',ex:true,
 q:`En un criadero, a 20 °C un pez consume 50 g de alimento al día y a 26 °C consume 68 g. Si el consumo C está relacionado linealmente con la temperatura T (válido entre 15 y 30 °C), ¿cuál es la ecuación y cuánto consume a 24 °C?`,
 o:['C = 3T − 10; consume 62 g','C = 3T + 10; consume 82 g','C = ⅓T + 43.3; consume 51.3 g','C = 3T − 10; consume 72 g'],a:0,
 s:`<ol><li>Puntos (T, C): (20, 50) y (26, 68).</li>
<li>m = (68 − 50)/(26 − 20) = 18/6 = 3 g por cada °C.</li>
<li>C − 50 = 3(T − 20) → C = 3T − 10.</li>
<li>C(24) = 3·24 − 10 = 62.</li></ol>
<p>${R('C = 3T − 10, y a 24 °C consume 62 g')}. La pendiente se lee como tasa de cambio: +3 g por cada grado.</p>`},
{id:'recta8',t:'recta',ex:true,
 q:`Una máquina costó S/ 20 000 y a los 4 años vale S/ 12 000. Si se deprecia linealmente, ¿en cuántos años su valor llega a cero?`,
 o:['10 años','6 años','8 años','12 años'],a:0,
 s:`<ol><li>Puntos (t, V): (0, 20 000) y (4, 12 000).</li>
<li>m = (12 000 − 20 000)/4 = −2 000: pierde S/ 2 000 por año.</li>
<li>V = 20 000 − 2 000t. Si V = 0 → t = 10.</li></ol>
<p>${R('A los 10 años')}. El 6 sale de dividir 12 000 entre 2 000 sin contar los 4 años que ya pasaron.</p>`},

/* ===== Costo, ingreso y equilibrio ===== */
{id:'equi1',t:'equi',
 q:`Producir 200 mochilas cuesta S/ 5 000 y producir 300 cuesta S/ 6 800. Si el costo es lineal, ¿cuál es el costo fijo?`,
 o:['S/ 1 400','S/ 1 800','S/ 3 600','S/ 5 000'],a:0,
 s:`<ol><li>m = (6 800 − 5 000)/(300 − 200) = 1 800/100 = 18 → costo variable S/ 18 por mochila.</li>
<li>C − 5 000 = 18(x − 200) → C(x) = 18x + 1 400.</li></ol>
<p>Costo fijo (el intercepto): ${R('S/ 1 400')}. Es lo que pagas aunque produzcas 0.</p>`},
{id:'equi2',t:'equi',
 q:`El costo fijo semanal de un taller es S/ 800 y producir 40 unidades le cuesta S/ 1 400 en total. Si el costo es lineal, ¿cuánto cuesta producir 60 unidades?`,
 o:['S/ 1 700','S/ 2 100','S/ 900','S/ 2 900'],a:0,
 s:`<ol><li>C(x) = mx + 800. Con (40, 1 400): 1 400 = 40m + 800 → m = 15.</li>
<li>C(x) = 15x + 800 → C(60) = 900 + 800 = 1 700.</li></ol>
<p>${R('S/ 1 700')}. El 2 100 sale de una regla de tres, que ignora el costo fijo.</p>`},
{id:'equi3',t:'equi',
 q:`Una panadería de Breña tiene costos fijos de S/ 2 400 al mes, un costo variable de S/ 0.20 por pan y vende cada pan a S/ 0.50. ¿Cuál es su punto de equilibrio?`,
 o:['8 000 panes, con ingreso de S/ 4 000','4 800 panes, con ingreso de S/ 2 400','12 000 panes, con ingreso de S/ 6 000','3 429 panes, con ingreso de S/ 1 714'],a:0,
 s:`<ol><li>Margen de contribución: p − cv = 0.50 − 0.20 = 0.30 por pan.</li>
<li>x<sub>e</sub> = CF/(p − cv) = 2 400/0.30 = 8 000 panes.</li>
<li>I<sub>e</sub> = p · x<sub>e</sub> = 0.50 · 8 000 = S/ 4 000.</li></ol>
<p>${R('8 000 panes al mes (S/ 4 000)')}. Por debajo hay pérdida; por encima, utilidad.</p>`},
{id:'equi4',t:'equi',
 q:`En la misma panadería (CF = S/ 2 400, cv = S/ 0.20, p = S/ 0.50), ¿cuántos panes debe vender para ganar S/ 1 500 al mes?`,
 o:['13 000 panes','5 000 panes','7 800 panes','9 500 panes'],a:0,
 s:`<ol><li>U = (p − cv)x − CF = 0.30x − 2 400.</li>
<li>0.30x − 2 400 = 1 500 → 0.30x = 3 900 → x = 13 000.</li></ol>
<p>${R('13 000 panes')}. Fórmula directa: x = (CF + U<sub>meta</sub>)/(p − cv).</p>`},
{id:'equi5',t:'equi',
 q:`Una empresa tiene CF = S/ 4 500, un costo variable de S/ 6 por unidad y vende a S/ 15. Si vende 300 unidades, ¿cuál es su utilidad?`,
 o:['Pérdida de S/ 1 800','Ganancia de S/ 2 700','Ganancia de S/ 1 800','S/ 0: está en equilibrio'],a:0,
 s:`<ol><li>U = (15 − 6)·300 − 4 500 = 2 700 − 4 500 = −1 800.</li>
<li>Su equilibrio es x<sub>e</sub> = 4 500/9 = 500; con 300 unidades está por debajo.</li></ol>
<p>${R('Pérdida de S/ 1 800')}.</p>`},
{id:'equi6',t:'equi',
 q:`Una empresa compra un componente a S/ 80 la unidad. Fabricarlo le costaría S/ 12 000 fijos al año más S/ 50 por unidad. ¿Desde cuántas unidades al año conviene fabricar?`,
 o:['Desde 401 unidades (con 400 cuestan igual)','Desde 241 unidades','Desde 151 unidades','Nunca conviene fabricar'],a:0,
 s:`<ol><li>Comprar: C₁ = 80x. Fabricar: C₂ = 50x + 12 000.</li>
<li>Iguala: 80x = 50x + 12 000 → 30x = 12 000 → x = 400.</li>
<li>Para x &gt; 400, fabricar es más barato: la recta 80x queda por encima.</li></ol>
<p>${R('Más de 400 unidades al año')}; como son enteras, desde 401.</p>`},
{id:'equi7',t:'equi',
 q:`Demanda: 2p + 3x = 36. Oferta: 2p = x + 12. Halla el equilibrio de mercado.`,
 o:['x = 6, p = 9','x = 4, p = 12','x = 12, p = 12','x = 9, p = 6'],a:0,
 s:`<ol><li>Despeja p: demanda p = 18 − 1.5x; oferta p = 0.5x + 6.</li>
<li>Iguala: 18 − 1.5x = 0.5x + 6 → 12 = 2x → x = 6.</li>
<li>p = 0.5·6 + 6 = 9.</li></ol>
<p>${R('Equilibrio: 6 unidades a un precio de 9')}. (4; 12) solo cumple la demanda y (12; 12) solo la oferta.</p>`},
{id:'equi8',t:'equi',
 q:`Una vendedora elige entre dos planes de pago: P1 = 2 000 + 150x y P2 = 500 + 250x, donde x son los paquetes que vende al mes. ¿Desde cuántos paquetes le conviene P2?`,
 o:['Desde 16 paquetes (con 15 pagan igual)','Desde 6 paquetes','Desde 10 paquetes','P2 nunca conviene'],a:0,
 s:`<ol><li>Iguala: 2 000 + 150x = 500 + 250x → 1 500 = 100x → x = 15.</li>
<li>P2 tiene mayor pendiente (250 por paquete): después del cruce paga más.</li></ol>
<p>${R('Desde 16 paquetes')}. Con menos de 15 conviene P1, porque su parte fija es mayor.</p>`},
{id:'equi9',t:'equi',
 q:`Si una empresa sube su precio de venta y mantiene su costo fijo y su costo variable, ¿qué pasa con su punto de equilibrio en unidades?`,
 o:['Baja, porque aumenta el margen p − cv','Sube, porque vende más caro','No cambia: solo depende del costo fijo','Se vuelve negativo'],a:0,
 s:`<ul><li>x<sub>e</sub> = CF/(p − cv). Si p sube, el denominador crece y x<sub>e</sub> ${R('disminuye')}.</li>
<li>Con las chocotejas (CF = 1 800, cv = 1.5): con p = 3.50, x<sub>e</sub> = 900; con p = 4.50, x<sub>e</sub> = 600.</li></ul>
<p>Recuerda: el equilibrio solo tiene sentido si p &gt; cv.</p>`},

/* ===== La parábola ===== */
{id:'parab1',t:'parab',ex:true,
 q:`La función de demanda de un producto es p = 120 − 3q, donde p es el precio en dólares cuando se demandan q unidades. ¿Qué nivel de producción maximiza el ingreso total y cuánto es ese ingreso?`,
 o:['q = 20; ingreso máximo $1 200','q = 40; ingreso máximo $0','q = 20; ingreso máximo $2 400','q = 20; ingreso máximo $60'],a:0,
 s:`<ol><li>Ingreso = precio × cantidad: I(q) = (120 − 3q)q = 120q − 3q².</li>
<li>Es una parábola con a = −3 &lt; 0: abre hacia abajo y su vértice es un máximo.</li>
<li>h = −b/(2a) = −120/(2·(−3)) = 20.</li>
<li>k = I(20) = 120·20 − 3·20² = 2 400 − 1 200 = 1 200.</li></ol>
<p>${R('q = 20 unidades, ingreso máximo $1 200')}, a un precio de p = 120 − 60 = $60.</p>`},
{id:'parab2',t:'parab',ex:true,
 q:`El ingreso mensual por vender x unidades es R(x) = 24x − 0.03x² soles. ¿Cuántas unidades debe vender para maximizar el ingreso y cuál es el ingreso máximo?`,
 o:['400 unidades; S/ 4 800','800 unidades; S/ 0','400 unidades; S/ 9 600','200 unidades; S/ 3 600'],a:0,
 s:`<ol><li>a = −0.03, b = 24, c = 0.</li>
<li>h = −b/(2a) = −24/(2·(−0.03)) = −24/(−0.06) = 400.</li>
<li>k = R(400) = 24·400 − 0.03·400² = 9 600 − 4 800 = 4 800.</li></ol>
<p>${R('400 unidades al mes, con ingreso máximo de S/ 4 800')}. Vértice V(400; 4 800).</p>`},
{id:'parab3',t:'parab',
 q:`La utilidad semanal de una startup es U(x) = −2x² + 160x − 1 200 (x en unidades, U en soles). ¿Cuál es la utilidad máxima?`,
 o:['S/ 2 000, con 40 unidades','S/ 8 400, con 40 unidades','S/ 3 200, con 40 unidades','S/ −1 200, con 80 unidades'],a:0,
 s:`<ol><li>a = −2 &lt; 0: hay un máximo en el vértice.</li>
<li>h = −160/(2·(−2)) = 40.</li>
<li>U(40) = −2(1 600) + 160·40 − 1 200 = −3 200 + 6 400 − 1 200 = 2 000.</li></ol>
<p>${R('S/ 2 000 con 40 unidades')}. Cuidado: −2x² con x = 40 es −2·1 600 = −3 200.</p>`},
{id:'parab4',t:'parab',
 q:`Una empresa tiene ingreso I(q) = 60q − q² y costo C(q) = 20q + 300. ¿Para qué niveles de producción obtiene utilidad (U &gt; 0)?`,
 o:['Entre 10 y 30 unidades','Menos de 10 o más de 30 unidades','Solo con 20 unidades','Desde 15 unidades en adelante'],a:0,
 s:`<ol><li>U = I − C = 60q − q² − 20q − 300 = −q² + 40q − 300.</li>
<li>U = 0 → q² − 40q + 300 = 0 → (q − 10)(q − 30) = 0 → q = 10 y q = 30: dos puntos de equilibrio.</li>
<li>Como la parábola abre hacia abajo, U es positiva entre sus raíces.</li></ol>
<p>${R('Hay utilidad entre 10 y 30 unidades')}. La máxima está en el vértice: q = 20, con U = 100.</p>`},
{id:'parab5',t:'parab',
 q:`¿Cuál es el vértice de y = x² − 8x + 12 y hacia dónde abre la parábola?`,
 o:['V(4, −4), abre hacia arriba','V(4, −4), abre hacia abajo','V(−4, 60), abre hacia arriba','V(4, 12), abre hacia arriba'],a:0,
 s:`<ol><li>a = 1 &gt; 0: abre hacia arriba y el vértice es un mínimo.</li>
<li>h = −b/(2a) = 8/2 = 4; k = 4² − 8·4 + 12 = −4.</li>
<li>Raíces: (x − 2)(x − 6) = 0 → corta al eje x en 2 y 6, y al eje y en (0, 12).</li></ol>
<p>${R('V(4, −4), abre hacia arriba')}.</p>`},
{id:'parab6',t:'parab',
 q:`Demanda: p = 50 − q². Oferta: p = 2q + 15. ¿Cuál es el punto de equilibrio del mercado?`,
 o:['q = 5, p = 25','q = 7, p = 29','q = −7, p = 1','q ≈ 11.7, p ≈ 38.3'],a:0,
 s:`<ol><li>Iguala: 50 − q² = 2q + 15 → q² + 2q − 35 = 0.</li>
<li>Factoriza: (q + 7)(q − 5) = 0 → q = −7 o q = 5.</li>
<li>Una cantidad negativa no tiene sentido económico: q = 5, y p = 2·5 + 15 = 25.</li></ol>
<p>${R('Equilibrio: 5 unidades a precio 25')}. Comprueba en la demanda: 50 − 25 = 25 ✓.</p>`},

/* ===== Elipse e hipérbola ===== */
{id:'conic1',t:'conic',
 q:`En la elipse ${F('x²','25')} + ${F('y²','9')} = 1, ¿cuáles son los vértices y los focos?`,
 o:['Vértices (±5, 0); focos (±4, 0)','Vértices (±25, 0); focos (±16, 0)','Vértices (±5, 0); focos (±√34, 0)','Vértices (0, ±3); focos (0, ±4)'],a:0,
 s:`<ol><li>El denominador mayor va con x: eje mayor horizontal, a² = 25 → a = 5; b² = 9 → b = 3.</li>
<li>En la elipse c² = a² − b² = 25 − 9 = 16 → c = 4.</li></ol>
<p>${R('Vértices (±5, 0) y focos (±4, 0)')}. √34 sale de usar c² = a² + b², que es la relación de la hipérbola.</p>`},
{id:'conic2',t:'conic',
 q:`Para la hipérbola ${F('x²','16')} − ${F('y²','9')} = 1, ¿cuáles son sus asíntotas?`,
 o:['y = ±'+F(3,4)+'x','y = ±'+F(4,3)+'x','y = ±'+F(9,16)+'x','No tiene asíntotas'],a:0,
 s:`<ol><li>a² = 16 → a = 4; b² = 9 → b = 3.</li>
<li>Asíntotas de x²/a² − y²/b² = 1: y = ±(b/a)x.</li>
<li>Además c² = a² + b² = 25 → focos (±5, 0); vértices (±4, 0).</li></ol>
<p>${R('y = ±(3/4)x')}.</p>`},
{id:'conic3',t:'conic',
 q:`¿Qué cónica representa la ecuación 4x² − 9y² = 36?`,
 o:['Hipérbola','Elipse','Parábola','Circunferencia'],a:0,
 s:`<ul><li>Divide entre 36: ${F('x²','9')} − ${F('y²','4')} = 1.</li>
<li>x² e y² con signos opuestos → ${R('hipérbola')}.</li>
<li>Con el mismo signo sería elipse (circunferencia si además los coeficientes son iguales); con una sola variable al cuadrado, parábola.</li></ul>`},
{id:'conic4',t:'conic',
 q:`La frontera de posibilidades de producción de una empresa es ${F('x²','400')} + ${F('y²','225')} = 1, con x, y ≥ 0. Si produce 12 unidades de x, ¿cuántas unidades de y puede producir como máximo?`,
 o:['12','15','6','144'],a:0,
 s:`<ol><li>Reemplaza x = 12: 144/400 + y²/225 = 1 → y²/225 = 1 − 0.36 = 0.64.</li>
<li>y² = 225 · 0.64 = 144 → y = 12 (se toma la raíz positiva).</li></ol>
<p>${R('12 unidades de y')}. Es un cuarto de elipse: producir más de x obliga a producir menos de y.</p>`},
{id:'conic5',t:'conic',
 q:`La demanda de un producto cumple p · q = 600. ¿Qué tipo de curva es y qué pasa con el ingreso total cuando baja el precio?`,
 o:['Una hipérbola equilátera; el ingreso se mantiene en 600','Una parábola; el ingreso aumenta','Una elipse; el ingreso disminuye','Una recta; el ingreso se duplica'],a:0,
 s:`<ul><li>xy = k (con k &gt; 0) es una ${R('hipérbola equilátera')} cuyas asíntotas son los ejes.</li>
<li>El ingreso es I = p · q = 600 a cualquier precio: si el precio baja, la cantidad sube en la misma proporción.</li>
<li>Las curvas de indiferencia tienen una forma parecida: convexas hacia el origen.</li></ul>`}
];

/* ---------- fórmulas clave ---------- */
const FORMULAS=[
{k:'inec',h:`<ul>
<li>Multiplicar o dividir entre un negativo invierte el sentido: −2x ≤ 16 → x ≥ −8.</li>
<li>“No más de”, “a lo sumo” → ≤. “Al menos”, “como mínimo” → ≥.</li>
<li>Costo total = (costo unitario)·x + costo fijo.</li>
<li>Interseca siempre con el dominio del problema: 0 ≤ x ≤ total.</li>
<li>Inecuación cuadrática: factoriza, ubica las raíces y prueba el signo en cada zona.</li>
<li>Intervalos: paréntesis = extremo abierto (&lt;, &gt;); corchete = cerrado (≤, ≥).</li></ul>`},
{k:'matr',h:`<ul>
<li>Orden m × n = filas × columnas; a<sub>ij</sub> está en la fila i, columna j.</li>
<li>A(m×n) · B(n×p) = C(m×p): fila por columna. En general AB ≠ BA.</li>
<li>kA multiplica cada elemento; A ± B se hace elemento a elemento (mismo orden).</li>
<li>Aᵀ cambia filas por columnas. Identidad: AI = IA = A.</li></ul>`},
{k:'det',h:`<ul>
<li>Orden 2: ${M([['a','b'],['c','d']],{det:1})} = ad − bc.</li>
<li>Sarrus (solo 3×3): suma de diagonales que bajan − suma de diagonales que suben.</li>
<li>Cofactor: C<sub>ij</sub> = (−1)<sup>i+j</sup>·M<sub>ij</sub>, con signos + − + / − + − / + − +.</li>
<li>Propiedades: |Aᵀ| = |A|; intercambiar filas cambia el signo; fila de ceros o filas proporcionales → 0; kR<sub>i</sub> multiplica por k; |kA| = kⁿ|A|; R<sub>i</sub> + kR<sub>j</sub> no lo cambia; triangular → producto de la diagonal; |AB| = |A||B|; |A⁻¹| = 1/|A|.</li>
<li>Inversa 2×2: A⁻¹ = ${F(1,'ad − bc')} ${M([['d','−b'],['−c','a']])}, solo si det ≠ 0.</li></ul>`},
{k:'sist',h:`<ul>
<li>Forma matricial AX = B; si det(A) ≠ 0, X = A⁻¹B.</li>
<li>Cramer: x = Δx/Δ, y = Δy/Δ, z = Δz/Δ (en Δx se cambia la columna de x por B).</li>
<li>Gauss: [A | B] → escalonada → sustitución regresiva. Gauss-Jordan: [A | B] → [I | X].</li>
<li>Operaciones válidas: R<sub>i</sub> ↔ R<sub>j</sub>; kR<sub>i</sub> con k ≠ 0; R<sub>i</sub> + kR<sub>j</sub>.</li>
<li>Fila 0 = 0 → infinitas soluciones; fila 0 = c (c ≠ 0) → no hay solución.</li>
<li>En Excel o Sheets: =MDETERM( ), =MINVERSA( ), =MMULT( ).</li></ul>`},
{k:'leon',h:`<ul>
<li>a<sub>ij</sub> = z<sub>ij</sub>/X<sub>j</sub>: cada columna ÷ producción del sector que compra.</li>
<li>X = AX + D → (I − A)X = D → X = (I − A)⁻¹D.</li>
<li>Cada columna de A suma menos de 1; coeficiente primario = 1 − suma de la columna.</li>
<li>Multiplicador del sector j = suma de la columna j de (I − A)⁻¹.</li>
<li>Control: total de insumos primarios = total de demanda final.</li></ul>`},
{k:'recta',h:`<ul>
<li>Pendiente: m = (y₂ − y₁)/(x₂ − x₁).</li>
<li>Punto-pendiente: y − y₁ = m(x − x₁). Pendiente-intercepto: y = mx + b.</li>
<li>General: Ax + By + C = 0, con m = −A/B y b = −C/B.</li>
<li>Paralelas: m₁ = m₂. Perpendiculares: m₁ · m₂ = −1.</li>
<li>Horizontal: y = b (m = 0). Vertical: x = a (m no definida).</li>
<li>Interceptos: con el eje x haz y = 0; con el eje y haz x = 0.</li></ul>`},
{k:'equi',h:`<ul>
<li>C(x) = cv·x + CF; I(x) = p·x; U(x) = (p − cv)x − CF.</li>
<li>Equilibrio: x<sub>e</sub> = CF/(p − cv); I<sub>e</sub> = p·x<sub>e</sub>.</li>
<li>Utilidad meta: x = (CF + U<sub>meta</sub>)/(p − cv).</li>
<li>Equilibrio de mercado: iguala oferta y demanda.</li>
<li>Comparar planes o “fabricar o comprar”: iguala los costos y mira qué recta queda abajo después del cruce.</li></ul>`},
{k:'parab',h:`<ul>
<li>y = ax² + bx + c: si a &gt; 0 abre hacia arriba (mínimo); si a &lt; 0, hacia abajo (máximo).</li>
<li>Vértice V(h, k): h = −b/(2a) y k = f(h).</li>
<li>Raíces: factoriza o usa x = (−b ± √(b² − 4ac))/(2a).</li>
<li>Ingreso con demanda lineal: I = p·q, que es una parábola.</li></ul>`},
{k:'conic',h:`<ul>
<li>Elipse ${F('x²','a²')} + ${F('y²','b²')} = 1 (a &gt; b): vértices (±a, 0), c² = a² − b², focos (±c, 0).</li>
<li>Hipérbola ${F('x²','a²')} − ${F('y²','b²')} = 1: vértices (±a, 0), c² = a² + b², asíntotas y = ±(b/a)x.</li>
<li>xy = k: hipérbola equilátera (demanda de ingreso constante).</li>
<li>Ax² + Cy² = F: mismo signo → elipse; signos opuestos → hipérbola.</li></ul>`}
];

return {PREGUNTAS, PROBLEMAS, FORMULAS};
})();
