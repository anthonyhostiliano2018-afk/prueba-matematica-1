 s:`<ol><li>C = 7x + 15 000 + 6(5 000 − x) + 20 000 = x + 65 000.</li>
<li>x + 65 000 ≤ 68 000 → x ≤ 3 000.</li></ol>
<p>${R('Máximo 3 000 unidades en A')}. Como aquí el coeficiente de x es positivo, la desigualdad no se invierte y sale un máximo; en el caso anterior (coeficiente negativo) salía un mínimo.</p>`},
{id:'i3',t:'inec',
 q:`En el enunciado “la compañía ha decidido asignar no más de $117 000 para costos totales”, ¿cómo se escribe la condición?`,
 o:['C ≤ 117 000','C ≥ 117 000','C &lt; 117 000','C = 117 000'],a:0,
 s:`<ul><li>“No más de”, “a lo sumo” o “como máximo” incluyen el valor límite: ${R('≤')}.</li>
<li>“Al menos”, “no menos de” o “como mínimo”: ≥.</li></ul>`},
{id:'i4',t:'inec',
 q:`Resuelve 2(x − 3) + 5 ≥ 4x − 7.`,
 o:['x ≤ 3','x ≥ 3','x ≤ −3','x ≥ −3'],a:0,
 s:`<ol><li>2x − 6 + 5 ≥ 4x − 7 → 2x − 1 ≥ 4x − 7.</li>
<li>2x − 4x ≥ −7 + 1 → −2x ≥ −6.</li>
<li>Divide entre −2 e invierte: x ≤ 3.</li></ol><p>${R('CS = (−∞, 3]')}.</p>`},

/* ===== Matrices y determinantes (sesión 3 y pregunta 4 del parcial) ===== */
{id:'m1',t:'matr',
 q:`Dada B = ${M([[5,-2],[0,7],[3,1]])}, ¿cuál es su orden y cuánto vale b₃₁?`,
 o:['3 × 2 y b₃₁ = 3','2 × 3 y b₃₁ = 3','3 × 2 y b₃₁ = 1','3 × 2 y b₃₁ = 0'],a:0,
 s:`<ul><li>3 filas y 2 columnas → 3 × 2.</li><li>b₃₁: fila 3, columna 1 → ${R('3')}.</li></ul><p>b₃₂ = 1 y b₂₁ = 0.</p>`},
{id:'m2',t:'matr',
 q:`Si A = [−5] es una matriz de orden 1, ¿cuánto vale det(A)?`,
 o:['−5','5','0','No existe: el determinante es solo para 2 × 2 o más'],a:0,
 s:`<p>El determinante de orden 1 es el mismo número: |a| = a. Por eso det(A) = ${R('−5')}. No es valor absoluto, aunque se escriba con barras.</p>`},
{id:'m3',t:'matr',
 q:`Calcula el determinante de ${M([[1,2,-1],[3,0,2],[1,1,1]])} por Sarrus.`,
 o:['−7','7','9','−9'],a:0,
 s:`<ol><li>Diagonales que bajan (+): 1·0·1 + 2·2·1 + (−1)·3·1 = 0 + 4 − 3 = 1.</li>
<li>Diagonales que suben (−): (−1)·0·1 + 1·2·1 + 2·3·1 = 0 + 2 + 6 = 8.</li>
<li>|A| = 1 − 8 = −7.</li></ol>
<p>${R('|A| = −7')}. Con cofactores por la fila 1: 1(0 − 2) − 2(3 − 2) + (−1)(3 − 0) = −2 − 2 − 3 = −7 ✓.</p>`},
{id:'m4',t:'matr',
 q:`En la misma matriz ${M([[1,2,-1],[3,0,2],[1,1,1]])}, ¿cuánto vale el cofactor C₂₁?`,
 o:['−3','3','−1','5'],a:0,
 s:`<ol><li>Menor M₂₁: elimina la fila 2 y la columna 1 → ${M([[2,-1],[1,1]],{det:1})} = 2·1 − (−1)·1 = 3.</li>
<li>Signo: (−1)<sup>2+1</sup> = −1 (en el tablero, la posición 2,1 es −).</li></ol>
<p>${R('C₂₁ = −3')}.</p>`},
{id:'m5',t:'matr',
 q:`¿Cuánto vale el determinante de la matriz triangular ${M([[2,5,-1],[0,3,4],[0,0,-2]])}?`,
 o:['−12','12','3','0'],a:0,
 s:`<p>En una matriz triangular el determinante es el producto de la diagonal: 2 · 3 · (−2) = ${R('−12')}. Por eso en la sesión se triangula con R<sub>i</sub> → R<sub>i</sub> − kR<sub>j</sub>, que no cambia el determinante.</p>`},
{id:'m6',t:'matr',ex:true,
 q:`Dadas A = ${M([[1,2,0],[0,1,3],[2,0,1]])} y B = ${M([[1,0,1],[2,1,0],[0,1,1]])}, ¿cuál es la fila 2 de AB?`,
 o:['(2, 4, 3)','(0, 1, 0)','(5, 2, 1)','(2, 1, 3)'],a:0,
 s:`<ol><li>Fila 2 de A: (0, 1, 3).</li>
<li>Por la columna 1 de B, (1, 2, 0): 0 + 2 + 0 = 2. Por la columna 2, (0, 1, 1): 0 + 1 + 3 = 4. Por la columna 3, (1, 0, 1): 0 + 0 + 3 = 3.</li></ol>
<p>${R('(2, 4, 3)')}. Completa: AB = ${M([[5,2,1],[2,4,3],[2,1,3]])}. (0, 1, 0) es multiplicar elemento por elemento.</p>`},
{id:'m7',t:'matr',ex:true,
 q:`Con las mismas A = ${M([[1,2,0],[0,1,3],[2,0,1]])} y B = ${M([[1,0,1],[2,1,0],[0,1,1]])}, ¿cuánto vale det(AB)?`,
 o:['39','16','10','−39'],a:0,
 s:`<ol><li>det(A) por la fila 1: 1(1·1 − 3·0) − 2(0·1 − 3·2) + 0 = 1 + 12 = 13.</li>
<li>det(B) por la fila 1: 1(1·1 − 0·1) − 0 + 1(2·1 − 1·0) = 1 + 2 = 3.</li>
<li>det(AB) = det(A) · det(B) = 13 · 3 = 39.</li></ol>
<p>${R('det(AB) = 39')}. Si calculas Sarrus sobre AB también sale 74 − 35 = 39: así verificas la propiedad, como pide el parcial.</p>`},
{id:'m8',t:'matr',
 q:`¿Cuál es la inversa de ${M([[5,2],[2,1]])}?`,
 o:[M([[1,-2],[-2,5]]),M([[1,2],[2,5]]),M([[5,-2],[-2,1]]),M([[-1,2],[2,-5]])],a:0,
 s:`<ol><li>det = 5·1 − 2·2 = 1.</li><li>Intercambia la diagonal (5 ↔ 1) y cambia el signo de la secundaria; multiplica por 1/1.</li></ol>
<p>A⁻¹ = ${R(M([[1,-2],[-2,5]]))}. Truco de verificación: A · A⁻¹ = I.</p>`},

/* ===== Sistemas: Cramer y Gauss-Jordan (sesión 3 y pregunta 3 del parcial) ===== */
{id:'s1',t:'sist',
 q:`En un modelo de producción AX = B, la gerencia encuentra que det(A) = 0. ¿Qué significa?`,
 o:['No hay un plan único: hay infinitos planes o ninguno cumple todas las restricciones','Existe un único plan de producción','El plan óptimo es no producir nada','Hay que usar Cramer'],a:0,
 s:`<ul><li>det(A) ≠ 0: los procesos son independientes y hay ${R('un único plan')} que usa exactamente los recursos.</li>
<li>det(A) = 0: algún proceso es combinación de otros. Cramer no se puede aplicar; con Gauss-Jordan sabrás si son infinitas soluciones o ninguna.</li></ul>`},
{id:'s2',t:'sist',
 q:`Resuelve por Cramer: 3x + 2y = 7, x − 4y = 7.`,
 o:['x = 3, y = −1','x = −3, y = 1','x = 1, y = 2','x = 3, y = 1'],a:0,
 s:`<ol><li>Δ = ${M([[3,2],[1,-4]],{det:1})} = −12 − 2 = −14.</li>
<li>Δx = ${M([[7,2],[7,-4]],{det:1})} = −28 − 14 = −42 → x = −42/−14 = 3.</li>
<li>Δy = ${M([[3,7],[1,7]],{det:1})} = 21 − 7 = 14 → y = 14/−14 = −1.</li></ol>
<p>${R('x = 3, y = −1')}. Verifica: 9 − 2 = 7 ✓ y 3 + 4 = 7 ✓.</p>`},
{id:'s3',t:'sist',
 q:`Un taller de Gamarra fabrica mochilas (x) y loncheras (y). En corte: 2x + y = 50 horas; en costura: x + 3y = 60 horas. Con Cramer, ¿cuántas fabrica usando todas las horas?`,
 o:['18 mochilas y 14 loncheras','14 mochilas y 18 loncheras','20 mochilas y 10 loncheras','15 mochilas y 20 loncheras'],a:0,
 s:`<ol><li>Δ = 2·3 − 1·1 = 5.</li><li>Δx = 50·3 − 1·60 = 90 → x = 18.</li><li>Δy = 2·60 − 50·1 = 70 → y = 14.</li></ol>
<p>${R('18 mochilas y 14 loncheras')}. Verifica: 36 + 14 = 50 ✓ y 18 + 42 = 60 ✓. (20 y 10 solo cumple el corte.)</p>`},
{id:'s4',t:'sist',
 q:`En la matriz aumentada ${M([[1,2,1,8],[2,1,3,13],[3,1,2,11]],{aug:3})}, ¿cómo queda la fila 2 después de R₂ → R₂ − 2R₁?`,
 o:['(0, −3, 1 | −3)','(0, 3, 1 | −3)','(0, −3, 1 | 3)','(−1, −3, 1 | −3)'],a:0,
 s:`<p>Resta elemento por elemento, incluida la columna después de la barra: (2, 1, 3 | 13) − 2(1, 2, 1 | 8) = (2 − 2, 1 − 4, 3 − 2 | 13 − 16) = ${R('(0, −3, 1 | −3)')}.</p><p>Error común: no operar el término independiente.</p>`},
{id:'s5',t:'sist',
 q:`El sistema x + y + z = 4, x − y + 2z = 3, 2x + 3z = 7 se reduce con Gauss hasta que la última fila queda (0, 0, 0 | 0). ¿Qué tipo de sistema es?`,
 o:['Compatible indeterminado: infinitas soluciones','Incompatible: no tiene solución','Compatible determinado: solución única','Compatible determinado con z = 0'],a:0,
 s:`<ul><li>La tercera ecuación es la suma de las dos primeras: (1 + 1, 1 − 1, 1 + 2 | 4 + 3) = (2, 0, 3 | 7). Es redundante.</li>
<li>Fila 0 = 0 → una variable queda libre (z = t): ${R('infinitas soluciones')}.</li>
<li>Si fuera 0 = c con c ≠ 0, sería incompatible.</li></ul>`},
{id:'s6',t:'sist',ex:true,
 q:`Un criador de cuyes mezcla tres marcas de alimento para dar exactamente 13 unidades de proteína, 11 de fibra y 12 de minerales por semana. Por bolsa, la marca I aporta 1 de proteína, 2 de fibra y 1 de minerales; la II, 1, 1 y 2; la III, 2, 1 y 1. Con Gauss y matriz aumentada, ¿cuántas bolsas de cada marca usa?`,
 o:['2 de I, 3 de II y 4 de III','3 de I, 2 de II y 4 de III','4 de I, 3 de II y 2 de III','2 de I, 4 de II y 3 de III'],a:0,
 s:`<ol><li>${SYS(['x + y + 2z = 13 (proteína)','2x + y + z = 11 (fibra)','x + 2y + z = 12 (minerales)'])}</li>
<li>${M([[1,1,2,13],[2,1,1,11],[1,2,1,12]],{aug:3})}</li>
<li>R₂ → R₂ − 2R₁ y R₃ → R₃ − R₁: ${M([[1,1,2,13],[0,-1,-3,-15],[0,1,-1,-1]],{aug:3})}</li>
<li>R₃ → R₃ + R₂: ${M([[1,1,2,13],[0,-1,-3,-15],[0,0,-4,-16]],{aug:3})}</li>
<li>z = 4; −y − 12 = −15 → y = 3; x = 13 − 3 − 8 = 2.</li></ol>
<p>${R('2 bolsas de I, 3 de II y 4 de III')}. Cada columna de la matriz es una marca; cada fila, un nutriente.</p>`},
{id:'s7',t:'sist',ex:true,
 q:`Con la mezcla de los cuyes (2 bolsas de I, 3 de II y 4 de III), si las bolsas cuestan S/ 25, S/ 30 y S/ 35, ¿cuánto se gasta por semana?`,
 o:['S/ 280','S/ 90','S/ 275','S/ 285'],a:0,
 s:`<p>25·2 + 30·3 + 35·4 = 50 + 90 + 140 = ${R('S/ 280')}. Es el producto del vector de precios por el vector solución.</p>`},
{id:'s8',t:'sist',
 q:`¿Cuál afirmación sobre Cramer y Gauss-Jordan es correcta?`,
 o:['Gauss-Jordan sirve para cualquier sistema y lo clasifica; Cramer solo para sistemas n × n con det(A) ≠ 0','Cramer sirve para cualquier sistema, aunque det(A) = 0','Gauss-Jordan solo sirve para sistemas 2 × 2','Cramer y Gauss-Jordan dan resultados distintos'],a:0,
 s:`<ul><li>Cramer: solo sistemas cuadrados con det ≠ 0; muy eficiente si solo te piden una incógnita.</li>
<li>Gauss-Jordan: cualquier tamaño, y te dice si hay solución única, infinitas o ninguna.</li></ul><p>Cuando ambos se pueden usar, ${R('dan la misma solución')}.</p>`},
{id:'s9',t:'sist',
 q:`En Excel o Google Sheets, con A en A1:C3 y B en E1:E3, ¿qué fórmula da la solución X = A⁻¹B?`,
 o:['=MMULT(MINVERSA(A1:C3);E1:E3)','=MDETERM(A1:C3)','=MINVERSA(E1:E3)','=SUMA(A1:C3;E1:E3)'],a:0,
 s:`<p>${R('=MMULT(MINVERSA(A1:C3);E1:E3)')}. MDETERM da el determinante y MINVERSA la inversa. En inglés: MMULT, MINVERSE y MDETERM.</p>`},

/* ===== Leontief (sesión 4) ===== */
{id:'l1',t:'leon',
 q:`Con esta tabla insumo-producto, ¿cuál es la matriz A? ${T_ME}`,
 o:[A_ME,M([[0.4,0.4],[0.125,0.5]]),M([[0.4,0.2],[0.125,0.5]]),M([[0.2,0.4],[0.5,0.25]])],a:0,
 s:`<ul><li>Columna Minería ÷ 200: 80/200 = 0.4 y 50/200 = 0.25.</li><li>Columna Energía ÷ 400: 80/400 = 0.2 y 200/400 = 0.5.</li></ul>
<p>A = ${R(A_ME)}. Columnas: 0.65 y 0.7, menores que 1 ✓. ${M([[0.4,0.4],[0.125,0.5]])} sale de dividir por filas.</p>`},
{id:'l2',t:'leon',
 q:`En A = ${A_ME} (sector 1 = Minería, sector 2 = Energía), ¿qué significa a₂₁ = 0.25?`,
 o:['Por cada unidad que produce Minería, compra 0.25 a Energía','Por cada unidad que produce Energía, compra 0.25 a Minería','Energía usa el 25 % de su propia producción','El 25 % de la minería va a la demanda final'],a:0,
 s:`<p>a₂₁ está en la fila 2 (Energía vende) y la columna 1 (Minería compra): ${R('por cada unidad que produce Minería, le compra 0.25 a Energía')}. Recuerda: la columna es el sector que compra.</p>`},
{id:'l3',t:'leon',
 q:`Para A = ${A_ME}, ¿cuál es (I − A)⁻¹?`,
 o:[INV_ME,M([[2.4,0.8],[1,2]]),M([[2,-0.8],[-1,2.4]]),M([[0.5,0.2],[0.25,0.6]])],a:0,
 s:`<ol><li>I − A = ${M([[0.6,-0.2],[-0.25,0.5]])}.</li>
<li>det = 0.6·0.5 − (−0.2)(−0.25) = 0.30 − 0.05 = 0.25.</li>
<li>(1/0.25)·${M([[0.5,0.2],[0.25,0.6]])} = 4·(…)</li></ol>
<p>(I − A)⁻¹ = ${R(INV_ME)}. ${M([[2.4,0.8],[1,2]])} sale de olvidar intercambiar la diagonal.</p>`},
{id:'l4',t:'leon',
 q:`Con (I − A)⁻¹ = ${INV_ME}, si la demanda final pasa a D = (60, 200), ¿cuánto debe producir cada sector?`,
 o:['Minería 280 y Energía 540','Minería 540 y Energía 280','Minería 200 y Energía 400','Minería 280 y Energía 500'],a:0,
 s:`<ol><li>X₁ = 2·60 + 0.8·200 = 120 + 160 = 280.</li><li>X₂ = 1·60 + 2.4·200 = 60 + 480 = 540.</li></ol>
<p>${R('X = (280, 540)')}. Verifica con X = AX + D: 0.4·280 + 0.2·540 + 60 = 112 + 108 + 60 = 280 ✓.</p>`},
{id:'l5',t:'leon',
 q:`Con (I − A)⁻¹ = ${INV_ME}, ¿qué sector tiene mayor multiplicador de producción?`,
 o:['Energía, con 3.2','Minería, con 3.0','Minería, con 2.8','Energía, con 3.4'],a:0,
 s:`<p>Suma de columnas: Minería 2 + 1 = 3.0; Energía 0.8 + 2.4 = 3.2. ${R('Energía, con 3.2')}: cada S/ 1 extra de demanda final de energía genera S/ 3.20 de producción total. (2.8 y 3.4 son sumas de filas.)</p>`},
{id:'l6',t:'leon',
 q:`En la tabla original, los insumos primarios eran 70 en Minería (de 200) y 120 en Energía (de 400). Con la nueva producción X = (280, 540), ¿cuánto suman los nuevos insumos primarios?`,
 o:['260','190','820','275'],a:0,
 s:`<ol><li>Coeficientes primarios: 70/200 = 0.35 y 120/400 = 0.3.</li><li>Nuevos: 0.35·280 = 98 y 0.3·540 = 162 → total 260.</li></ol>
<p>${R('260')}, igual a la nueva demanda final 60 + 200 = 260: el control cuadra ✓.</p>`},
{id:'l7',t:'leon',
 q:`¿Cuál de estos <b>no</b> es un supuesto del modelo de Leontief?`,
 o:['Los coeficientes técnicos cambian cada periodo según la tecnología','Cada sector produce un solo bien','Producción total = insumos totales','La matriz A es constante en el periodo'],a:0,
 s:`<p>El modelo supone ${R('A constante')} (tecnología fija). Por eso sus predicciones son confiables a corto plazo: con el cambio tecnológico, los coeficientes se modifican y habría que recalcular A.</p>`},

/* ===== La recta (sesión 5 y clase del 6/10) ===== */
{id:'r1',t:'recta',
 q:`Halla la ecuación general de la recta que pasa por (−2, 5) y (4, −1).`,
 o:['x + y − 3 = 0','x − y + 7 = 0','x + y + 3 = 0','x + y − 7 = 0'],a:0,
 s:`<ol><li>m = (−1 − 5)/(4 − (−2)) = −6/6 = −1.</li><li>y = mx + b con (−2, 5): 5 = (−1)(−2) + b → b = 3 → y = −x + 3.</li><li>General: x + y − 3 = 0.</li></ol>
<p>${R('x + y − 3 = 0')}. Verifica con (4, −1): 4 − 1 − 3 = 0 ✓.</p>`},
{id:'r2',t:'recta',
 q:`Una recta tiene pendiente −2 y ordenada al origen 4. ¿En qué punto corta al eje x?`,
 o:['(2, 0)','(4, 0)','(−2, 0)','(0, 4)'],a:0,
 s:`<ol><li>y = −2x + 4.</li><li>Eje x: y = 0 → −2x + 4 = 0 → x = 2.</li></ol><p>${R('(2, 0)')}. (0, 4) es el corte con el eje y.</p>`},
{id:'r3',t:'recta',
 q:`Halla la recta que pasa por (2, 1) y es perpendicular a 3x − y + 4 = 0.`,
 o:['x + 3y − 5 = 0','3x − y − 5 = 0','x − 3y + 1 = 0','x + 3y + 5 = 0'],a:0,
 s:`<ol><li>Despeja: y = 3x + 4 → m₁ = 3.</li><li>m₁ · m₂ = −1 → m₂ = −⅓.</li><li>y − 1 = −⅓(x − 2) → 3y − 3 = −x + 2 → x + 3y − 5 = 0.</li></ol>
<p>${R('x + 3y − 5 = 0')}. 3x − y − 5 = 0 es la paralela.</p>`},
{id:'r4',t:'recta',
 q:`Halla la recta que pasa por (1, 3) y es paralela a 4x + 2y = 1.`,
 o:['y = −2x + 5','y = 2x + 1','y = −2x + 1','y = ½x + 2.5'],a:0,
 s:`<ol><li>4x + 2y = 1 → y = −2x + ½ → m = −2.</li><li>Paralela: misma pendiente. 3 = −2·1 + b → b = 5.</li></ol><p>${R('y = −2x + 5')}.</p>`},
{id:'r5',t:'recta',
 q:`¿Cuál es la recta que pasa por (−4, 6) y es paralela al eje y?`,
 o:['x = −4','y = 6','y = −4','x = 6'],a:0,
 s:`<p>Paralela al eje y significa vertical (pendiente no definida): todos sus puntos tienen la misma x. ${R('x = −4')}. La horizontal por ese punto sería y = 6.</p>`},
{id:'r6',t:'recta',ex:true,
 q:`La temperatura de ebullición del agua T (°C) baja linealmente con la altitud h (m): a 0 m es 100 °C y a 3 000 m es 90 °C (válido entre 0 y 5 000 m). ¿Cuál es la ecuación y a qué temperatura hierve el agua en Puno (3 900 m)?`,
 o:[`T = 100 − ${F('h','300')}; 87 °C`,`T = 100 − ${F('h','300')}; 113 °C`,`T = 100 − 300h; −1 169 900 °C`,`T = 90 − ${F('h','300')}; 77 °C`],a:0,
 s:`<ol><li>Puntos (h, T): (0, 100) y (3 000, 90).</li><li>m = (90 − 100)/(3 000 − 0) = −10/3 000 = −1/300 (baja 1 °C cada 300 m).</li><li>El intercepto es 100: T = 100 − h/300.</li><li>T(3 900) = 100 − 13 = 87.</li></ol>
<p>${R('T = 100 − h/300; en Puno hierve a 87 °C')}.</p>`},

/* ===== Costo, ingreso y equilibrio (sesión 5) ===== */
{id:'e1',t:'equi',
 q:`Los costos fijos de fabricar un artículo son $450 a la semana y fabricar 30 unidades cuesta $840 en total. Si el costo es lineal, ¿cuánto cuesta fabricar 50 unidades?`,
 o:['$1 100','$1 400','$650','$1 290'],a:0,
 s:`<ol><li>C = mx + 450; con (30, 840): 840 = 30m + 450 → m = 13.</li><li>C(50) = 13·50 + 450 = 650 + 450 = 1 100.</li></ol>
<p>${R('$1 100')}. $1 400 sale de una regla de tres, que ignora el costo fijo.</p>`},
{id:'e2',t:'equi',
 q:`Producir 80 polos cuesta S/ 1 900 y producir 120 cuesta S/ 2 500. Si el costo es lineal, ¿cuál es el costo fijo y cuánto cuestan 200 polos?`,
 o:['CF = S/ 700; 200 polos cuestan S/ 3 700','CF = S/ 1 900; 200 polos cuestan S/ 4 900','CF = S/ 600; 200 polos cuestan S/ 3 600','CF = S/ 15; 200 polos cuestan S/ 3 000'],a:0,
 s:`<ol><li>m = (2 500 − 1 900)/(120 − 80) = 600/40 = 15 por polo.</li><li>C − 1 900 = 15(x − 80) → C = 15x + 700.</li><li>C(200) = 3 000 + 700 = 3 700.</li></ol>
<p>${R('CF = S/ 700 y C(200) = S/ 3 700')}.</p>`},
{id:'e3',t:'equi',
 q:`Un puesto de chicha morada tiene costos fijos de S/ 2 160 al mes, costo variable de S/ 1.20 por vaso y vende cada vaso a S/ 3. ¿Cuál es su punto de equilibrio?`,
 o:['1 200 vasos, con ingreso de S/ 3 600','720 vasos, con ingreso de S/ 2 160','1 800 vasos, con ingreso de S/ 5 400','514 vasos, con ingreso de S/ 1 543'],a:0,
 s:`<ol><li>p − cv = 3 − 1.20 = 1.80.</li><li>x<sub>e</sub> = 2 160/1.80 = 1 200 vasos.</li><li>I<sub>e</sub> = 3 · 1 200 = S/ 3 600.</li></ol><p>${R('1 200 vasos al mes (S/ 3 600)')}.</p>`},
{id:'e4',t:'equi',
 q:`En el mismo puesto (CF = S/ 2 160, cv = S/ 1.20, p = S/ 3), ¿cuántos vasos debe vender para ganar S/ 900 al mes?`,
 o:['1 700 vasos','500 vasos','1 020 vasos','2 100 vasos'],a:0,
 s:`<p>x = (CF + U<sub>meta</sub>)/(p − cv) = (2 160 + 900)/1.80 = 3 060/1.80 = ${R('1 700 vasos')}.</p>`},
{id:'e5',t:'equi',
 q:`El costo diario de producir x sillas es C(x) = 4x + 600. Si se venden 200 sillas al día, ¿cuál es el precio mínimo para no perder?`,
 o:['S/ 7','S/ 3','S/ 4','S/ 10'],a:0,
 s:`<ol><li>C(200) = 4·200 + 600 = 1 400.</li><li>Sin pérdida: 200p = 1 400 → p = 7.</li></ol><p>${R('S/ 7 como precio mínimo')}.</p>`},
{id:'e6',t:'equi',
 q:`Una mueblería compra un componente a S/ 45. Fabricarlo cuesta S/ 18 000 fijos al año más S/ 30 por unidad. ¿Desde cuántas unidades al año conviene fabricar?`,
 o:['Más de 1 200','Más de 600','Más de 400','Menos de 1 200'],a:0,
 s:`<ol><li>45x = 30x + 18 000 → 15x = 18 000 → x = 1 200.</li><li>Con más de 1 200 unidades, fabricar sale más barato.</li></ol><p>${R('Más de 1 200 unidades al año')} (en 1 200 cuestan igual).</p>`},
{id:'e7',t:'equi',
 q:`Demanda: p = 40 − 3x. Oferta: p = 2x + 10. ¿Cuál es el equilibrio de mercado?`,
 o:['x = 6, p = 22','x = 22, p = 6','x = 4, p = 28','x = 5, p = 25'],a:0,
 s:`<ol><li>2x + 10 = 40 − 3x → 5x = 30 → x = 6.</li><li>p = 2·6 + 10 = 22.</li></ol><p>${R('6 unidades a precio 22')}. Comprueba en la demanda: 40 − 18 = 22 ✓.</p>`},
{id:'e8',t:'equi',
 q:`Una vendedora elige cómo le pagan: P1 = 3 000 + 200x o P3 = 400x (x = paquetes al mes). ¿Desde cuántos paquetes le conviene más P3?`,
 o:['Desde 16 paquetes','Desde 8 paquetes','Desde 15 paquetes','Nunca'],a:0,
 s:`<ol><li>Iguala: 400x = 3 000 + 200x → x = 15 (ambos pagan S/ 6 000).</li><li>P3 tiene mayor pendiente: después de 15 paga más.</li></ol><p>${R('Desde 16 paquetes')}; con menos, P1 paga más.</p>`},

/* ===== La parábola (clase del 6/10 y pregunta 2 del parcial) ===== */
{id:'p1',t:'parab',ex:true,
 q:`La función de demanda de un producto es p = 300 − 5q (p en dólares, q en unidades). ¿Qué nivel de producción maximiza el ingreso total y cuánto es?`,
 o:['q = 30; ingreso máximo $4 500','q = 60; ingreso máximo $0','q = 30; ingreso máximo $9 000','q = 30; ingreso máximo $150'],a:0,
 s:`<ol><li>I = p·q = 300q − 5q². a = −5, b = 300.</li><li>h = −b/(2a) = −300/(−10) = 30.</li><li>k = I(30) = 9 000 − 4 500 = 4 500.</li></ol>
<p>${R('q = 30; ingreso máximo $4 500')}, con precio p = 300 − 150 = $150.</p>`},
{id:'p2',t:'parab',ex:true,
 q:`El ingreso mensual por vender x unidades es R(x) = 18x − 0.02x² dólares. ¿Cuántas unidades maximizan el ingreso y cuál es el ingreso máximo?`,
 o:['450 unidades; $4 050','900 unidades; $0','450 unidades; $8 100','225 unidades; $3 037.50'],a:0,
 s:`<ol><li>a = −0.02, b = 18, c = 0.</li><li>h = −18/(2·(−0.02)) = −18/(−0.04) = 450.</li><li>k = 18·450 − 0.02·450² = 8 100 − 4 050 = 4 050.</li></ol><p>${R('450 unidades; $4 050')}. V(450; 4 050).</p>`},
{id:'p3',t:'parab',
 q:`Para graficar y = x² − 4x − 5, ¿cuál es su vértice y dónde corta al eje x?`,
 o:['V(2, −9); corta en x = −1 y x = 5','V(−2, 7); corta en x = 1 y x = −5','V(2, −9); corta en x = 1 y x = −5','V(2, −5); corta en x = −1 y x = 5'],a:0,
 s:`<ol><li>h = −(−4)/(2·1) = 2; k = 4 − 8 − 5 = −9 → V(2, −9).</li><li>x² − 4x − 5 = 0 → (x − 5)(x + 1) = 0 → x = 5 y x = −1.</li><li>a = 1 &gt; 0: abre hacia arriba; corta al eje y en (0, −5).</li></ol><p>${R('V(2, −9); raíces −1 y 5')}.</p>`},
{id:'p4',t:'parab',
 q:`La utilidad de un negocio es U(x) = −x² + 60x − 500. ¿Cuál es la utilidad máxima?`,
 o:['400, con 30 unidades','1 300, con 30 unidades','−500, con 0 unidades','0, con 10 unidades'],a:0,
 s:`<ol><li>h = −60/(2·(−1)) = 30.</li><li>U(30) = −900 + 1 800 − 500 = 400.</li></ol>
<p>${R('400 con 30 unidades')}. Sus puntos de equilibrio son x = 10 y x = 50, donde U = 0.</p>`},
{id:'p5',t:'parab',
 q:`¿Por qué el vértice de I(q) = 300q − 5q² es un máximo y no un mínimo?`,
 o:['Porque a = −5 &lt; 0 y la parábola abre hacia abajo','Porque b = 300 es positivo','Porque c = 0','Porque toda parábola tiene un máximo'],a:0,
 s:`<p>El signo de a decide: si ${R('a &lt; 0, abre hacia abajo')} y el vértice es el punto más alto (máximo); si a &gt; 0, abre hacia arriba y el vértice es un mínimo, como en y = x² − 6x + 5.</p>`}
];

/* ---------- fórmulas: solo lo de las diapositivas ---------- */
const FORMULAS=[
{k:'inec',h:`<ul>
<li>“No más de” → ≤; “al menos” → ≥.</li>
<li>Costo total = costo unitario·x + costo fijo, sumando ambas plantas.</li>
<li>Multiplicar o dividir entre un negativo invierte el sentido.</li>
<li>Coeficiente de x negativo → sale un mínimo; positivo → un máximo. Interseca con 0 ≤ x ≤ total.</li></ul>`},
{k:'matr',h:`<ul>
<li>A(m×n)·B(n×p) = C(m×p): fila por columna.</li>
<li>Orden 1: |a| = a. Orden 2: ad − bc. Orden 3: Sarrus (bajan − suben).</li>
<li>Menor M<sub>ij</sub>: quita fila i y columna j. Cofactor C<sub>ij</sub> = (−1)<sup>i+j</sup>M<sub>ij</sub>. Laplace: suma de elementos por sus cofactores.</li>
<li>|Aᵀ| = |A|; Rᵢ ↔ Rⱼ cambia el signo; fila nula o proporcional → 0; kRᵢ → k|A|; |kA| = kⁿ|A|; Rᵢ + kRⱼ no cambia; triangular → producto de la diagonal; |AB| = |A||B|; |A⁻¹| = 1/|A|.</li>
<li>Inversa 2×2: ${F(1,'ad − bc')}${M([['d','−b'],['−c','a']])}. Existe solo si det ≠ 0.</li></ul>`},
{k:'sist',h:`<ul>
<li>AX = B: A tecnología, X decisiones, B recursos.</li>
<li>Cramer: xᵢ = Δᵢ/Δ (cambia la columna i por B). Solo n×n con Δ ≠ 0.</li>
<li>Gauss-Jordan: [A | B] → [I | X] con Rᵢ ↔ Rⱼ, kRᵢ (k ≠ 0), Rᵢ + kRⱼ.</li>
<li>Única: r(A) = r(A|B) = n. Infinitas: fila 0 = 0. Ninguna: fila 0 = c ≠ 0.</li>
<li>Excel: =MDETERM, =MINVERSA, =MMULT(MINVERSA(A);B).</li></ul>`},
{k:'leon',h:`<ul>
<li>Filas = ventas: Xᵢ = zᵢ₁ + zᵢ₂ + dᵢ. Columnas = compras: Xⱼ = z₁ⱼ + z₂ⱼ + vⱼ.</li>
<li>a<sub>ij</sub> = z<sub>ij</sub>/X<sub>j</sub> (columna ÷ total del que compra).</li>
<li>X = (I − A)⁻¹D. Multiplicador = suma de columna de (I − A)⁻¹.</li>
<li>Coeficiente primario = 1 − suma de columna. Control: Σ primarios = Σ demanda final.</li></ul>`},
{k:'recta',h:`<ul>
<li>m = (y₂ − y₁)/(x₂ − x₁); y = mx + b; y − y₁ = m(x − x₁); Ax + By + C = 0 con m = −A/B.</li>
<li>Paralelas m₁ = m₂; perpendiculares m₁·m₂ = −1.</li>
<li>Horizontal y = b; vertical x = a (perpendicular a x = a es horizontal).</li>
<li>Modelo lineal con dos datos: pendiente → punto-pendiente → evalúa.</li></ul>`},
{k:'equi',h:`<ul>
<li>C = cv·x + CF; I = p·x; U = (p − cv)x − CF.</li>
<li>x<sub>e</sub> = CF/(p − cv); I<sub>e</sub> = p·x<sub>e</sub>; utilidad meta: x = (CF + U)/(p − cv).</li>
<li>Precio mínimo vendiendo x₀: p = C(x₀)/x₀.</li>
<li>Fabricar o comprar, planes de pago y mercado: iguala las dos rectas.</li></ul>`},
{k:'parab',h:`<ul>
<li>y = ax² + bx + c; vértice h = −b/(2a), k = f(h).</li>
<li>a &lt; 0 → máximo; a &gt; 0 → mínimo.</li>
<li>Ingreso con demanda lineal: I = p·q = (a − bq)q.</li>
<li>Raíces: factoriza (x − r₁)(x − r₂) = 0.</li></ul>`}
];

return {PREGUNTAS, PROBLEMAS};
})();

{id:'n10',t:'leon',

function crearHoja(key, data, alCambiar){

  function tramo(st, i){

    ctx.beginPath();

function montarHoja(slot, key, obtener, alCambiar){

  if(hoja && hoja.key === key){ slot.replaceWith(hoja.el); hoja.ajustar(false); return; }
  cerrarHoja();
  hoja = crearHoja(key, obtener(), alCambiar);
  slot.replaceWith(hoja.el);
  hoja.ajustar(true);
}
function cerrarHoja(){ if(hoja){ hoja.destruir(); hoja = null; } }

/* Las hojas de los problemas de desarrollo se guardan en este dispositivo. */
const hojasDev = {}, tGuardar = {};
function codificar(d){
  return { h: d.h, s: d.s.map(st => {
    const a = [st.c, st.e]; let px = 0, py = 0;
    for(let i = 0; i < st.p.length; i += 3){ const x = Math.round(st.p[i] * 2), y = Math.round(st.p[i + 1] * 2); a.push(x - px, y - py, Math.round(st.p[i + 2] * 20)); px = x; py = y; }
    return a;
  }) };
}
function decodificar(r){
  if(!r || !Array.isArray(r.s)) return null;
  try {
    return { h: Math.min(H_MAX, Math.max(300, +r.h || 820)), s: r.s.map(a => {
      const st = { c: a[0], e: a[1], p: [] }; let x = 0, y = 0;
      for(let i = 2; i + 2 < a.length; i += 3){ x += a[i]; y += a[i + 1]; st.p.push(x / 2, y / 2, a[i + 2] / 20); }
      return st;
    }) };
  } catch(_){ return null; }
}
function cargarHojaDev(pid){
  if(!hojasDev[pid]) hojasDev[pid] = decodificar(store.get('hoja:' + pid, null)) || { h: 820, s: [] };
  return hojasDev[pid];
}
function guardarHojaDev(pid, ya){
  clearTimeout(tGuardar[pid]); delete tGuardar[pid];
  const fn = () => { delete tGuardar[pid]; if(hojasDev[pid]) store.set('hoja:' + pid, codificar(hojasDev[pid])); };
  if(ya) fn(); else tGuardar[pid] = setTimeout(fn, 600);
}
const guardarPendientes = () => Object.keys(tGuardar).forEach(pid => guardarHojaDev(pid, true));
window.addEventListener('pagehide', guardarPendientes);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') guardarPendientes(); });

function chrome(quiz){

}
function abar(html){

}

function start(ids, limit){
  ids = ids.filter(id => byId[id]);
  if(!ids.length) return;
  if(limit && S.cant !== 'all' && ids.length > S.cant) ids = shuffle(ids).slice(0, S.cant);
  ids = S.mezclar ? shuffle(ids) : ids.slice().sort((x, y) => byId[x].idx - byId[y].idx);
  const order = {};
  ids.forEach(id => { const base = byId[id].o.map((_, i) => i); order[id] = S.mezclar ? shuffle(base) : base; });
  S.ses = { ids, i:0, ans:{}, order, hojas:{}, final: S.modo === 'final', t0: Date.now(), confirmar:false };
  if(S.ses.final) iniciarReloj();
  S.view = 'quiz';
  render(); alInicio();
}

/* ---------- ronda de preguntas ---------- */
let relojH = 0;
function iniciarReloj(){ detenerReloj(); relojH = setInterval(() => { const el = document.getElementById('reloj'); if(el && S.ses) el.textContent = mmss(Math.floor((Date.now() - S.ses.t0) / 1000)); }, 1000); }
function detenerReloj(){ if(relojH){ clearInterval(relojH); relojH = 0; } }
function pintarSel(){
  const s = S.ses, r = s.ans[s.ids[s.i]];
  $app.querySelectorAll('.opt').forEach(b => { const on = !!r && +b.dataset.oi === r.oi; b.classList.toggle('sel', on); b.setAttribute('aria-pressed', String(on)); });
}
function navFinal(){
  const s = S.ses, last = s.i === s.ids.length - 1, falta = s.ids.filter(id => !s.ans[id]).length;
  const fin = s.confirmar
    ? '<button type="button" class="btn btn-alerta" data-act="terminar">' + (falta === 1 ? 'Falta 1: toca otra vez para terminar' : 'Faltan ' + falta + ': toca otra vez para terminar') + '</button>'
    : (last ? '<button type="button" class="btn btn-pri" data-act="terminar">Terminar la prueba</button>' : '<button type="button" class="btn btn-pri" data-act="next">Siguiente</button>');
  abar('<button type="button" class="btn btn-sec" data-act="prev"' + (s.i === 0 ? ' disabled' : '') + '>Anterior</button>' + fin);
}
function terminar(){
  const s = S.ses, falta = s.ids.filter(id => !s.ans[id]).length;
  if(falta && !s.confirmar){ s.confirmar = true; navFinal(); return; }
  s.ids.forEach(id => { if(s.ans[id]) prog[id] = s.ans[id].ok ? 1 : 0; });
  store.set('prog', prog);
  s.duracion = Math.floor((Date.now() - s.t0) / 1000);
  detenerReloj();
  S.view = 'res'; render(); alInicio();
}
function prev(){ const s = S.ses; if(s.i > 0){ s.i--; s.confirmar = false; renderQuiz(); alInicio(); } }
function renderQbar(){
  if(S.ses.final){
    const s = S.ses, hechas = s.ids.filter(id => s.ans[id]).length;

      '<span class="qpos">Pregunta ' + (s.i + 1) + ' de ' + s.ids.length + '</span>' +

function answer(oi){
  if(S.ses.final){
    const sf = S.ses, idf = sf.ids[sf.i];
    sf.ans[idf] = { oi, ok: oi === byId[idf].a }; sf.confirmar = false;

  }

function verUltimo(){
  const el = $app.querySelector('.final') || $app.querySelector('.steps li:last-child');
  if(!el) return;
  const r = el.getBoundingClientRect(), limite = window.innerHeight - 110;
  if(r.bottom > limite) window.scrollBy({ top: r.bottom - limite + 16, behavior: reduceMotion ? 'auto' : 'smooth' });
}

/* ---------- cronómetro ---------- */
function paintTimer(){
  const el = document.getElementById('tmr');
  if(!el) return;
  el.textContent = S.timer.rest === 0 ? 'Tiempo' : mmss(S.timer.rest);
  const box = el.closest('.timer');
  if(box) box.classList.toggle('low', S.timer.rest <= 300);
}
function tick(){
  const T = S.timer;
  T.rest = Math.max(0, T.rest - 1);
  if(T.rest === 0){ clearInterval(T.h); T.h = null; T.run = false; if(S.view !== 'quiz' && S.view !== 'res') render(); return; }
  paintTimer();
}
function toggleTimer(){
  const T = S.timer;
  if(T.run){ clearInterval(T.h); T.h = null; T.run = false; }
  else { if(T.rest === 0) T.rest = 3600; T.run = true; T.h = setInterval(tick, 1000); }
  render();
}
function resetTimer(){
  const T = S.timer;
  clearInterval(T.h); T.h = null; T.run = false; T.rest = 3600;
  render();
}

/* ---------- fórmulas ---------- */
function renderForm(){
  $app.innerHTML = '<section class="intro"><p>Lo esencial de cada tema para revisar antes del parcial.</p></section>' +
    [1, 2].map(u => '<h2 class="f-u">' + UNIDADES[u].n + '</h2>' +
      FORMULAS.filter(f => TEMAS[f.k].u === u).map(f => '<details class="fm"><summary>' + TEMAS[f.k].n + '</summary><div class="fm-b">' + f.h + '</div></details>').join('')).join('');
  abar(null);
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  const a = b.dataset.act;
  if(a !== 'borrar') S.borrar = false;
  switch(a){
    case 'tab':
      S.tab = b.dataset.tab; S.view = 'home'; render(); alInicio(); break;
    case 'tema': {
      const k = b.dataset.k; if(S.sel.has(k)) S.sel.delete(k); else S.sel.add(k);
      renderHome(); const nb = $app.querySelector('[data-act="tema"][data-k="' + k + '"]'); if(nb) nb.focus(); break; }
    case 'unidad': {
      const ks = temasDe(+b.dataset.u), all = ks.every(k => S.sel.has(k));
      ks.forEach(k => { if(all) S.sel.delete(k); else S.sel.add(k); });
      renderHome(); break; }
    case 'modo':
      S.modo = b.dataset.v === 'instante' ? 'instante' : 'final'; store.set('modo', S.modo); renderHome(); break;
    case 'prev': prev(); break;
    case 'terminar': terminar(); break;
    case 'filtro': {
      const l = $app.querySelector('.rev'); if(l) l.classList.toggle('solo-err', b.dataset.v === 'err');
      b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-checked', String(x === b))); break; }
    case 'cant':
      S.cant = b.dataset.v === 'all' ? 'all' : +b.dataset.v; renderHome(); break;
    case 'start': start(pool().map(q => q.id), true); break;
    case 'errores': start(Object.keys(prog).filter(id => byId[id] && prog[id] === 0), false); break;
    case 'solo': start(PREGUNTAS.filter(q => q.t === b.dataset.k).map(q => q.id), false); break;
    case 'borrar':
      if(S.borrar){ prog = {}; dev = {}; store.del('prog'); store.del('dev'); PROBLEMAS.forEach(p => { store.del('hoja:' + p.id); delete hojasDev[p.id]; }); S.borrar = false; }
      else S.borrar = true;
      renderHome(); break;
    case 'resp': answer(+b.dataset.oi); break;
    case 'next': next(); break;
    case 'salir': case 'inicio':
      S.view = 'home'; S.tab = 'practica'; render(); alInicio(); break;
    case 'repetir': {
      const s = S.ses; start(s.ids.filter(id => !(s.ans[id] && s.ans[id].ok)), false); break; }
    case 'prob':
      S.prob = +b.dataset.i; S.shown = 0; S.view = 'prob'; render(); alInicio(); break;
    case 'paso':
      S.shown++; S.anim = true; renderProb(); verUltimo(); break;
    case 'todos':
      S.shown = PROBLEMAS[S.prob].pasos.length; renderProb(); verUltimo(); break;
    case 'auto':
      dev[PROBLEMAS[S.prob].id] = b.dataset.v; store.set('dev', dev); renderProb(); break;
    case 'sigprob':
      S.prob++; S.shown = 0; renderProb(); alInicio(); break;
    case 'devlist':
      S.view = 'home'; S.tab = 'desarrollo'; render(); alInicio(); break;
    case 'tmr': toggleTimer(); break;
    case 'tmr0': resetTimer(); break;
  }
});
document.addEventListener('change', e => {
  if(e.target.id === 'soloEx'){ S.soloEx = e.target.checked; renderHome(); const el = document.getElementById('soloEx'); if(el) el.focus(); }
  if(e.target.id === 'mezclar'){ S.mezclar = e.target.checked; }
});
document.addEventListener('keydown', e => {
  if(S.view !== 'quiz' || e.altKey || e.ctrlKey || e.metaKey) return;
  const s = S.ses, id = s.ids[s.i], k = e.key.toLowerCase();
  if(s.final){
    let ix = ['1','2','3','4'].indexOf(k); if(ix < 0) ix = LET.indexOf(k);
    if(ix >= 0 && ix < s.order[id].length){ e.preventDefault(); answer(s.order[id][ix]); return; }
    if(k === 'arrowleft'){ e.preventDefault(); prev(); return; }
    if((k === 'arrowright' || (k === 'enter' && !e.target.closest('button,input,a,summary'))) && s.i < s.ids.length - 1){ e.preventDefault(); next(); }
    return;
  }
  if(!s.ans[id]){
    let idx = ['1','2','3','4'].indexOf(k); if(idx < 0) idx = LET.indexOf(k);
    if(idx >= 0 && idx < s.order[id].length){ e.preventDefault(); answer(s.order[id][idx]); }
  } else if(k === 'arrowright' || (k === 'enter' && !e.target.closest('button,input,a,summary'))){
    e.preventDefault(); next();
  }
});

render();
})();
</script>
